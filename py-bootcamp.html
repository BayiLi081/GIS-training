# GIS tools vs Python

How does **Python-based geospatial analysis** compare with **GUI-based GIS software** such as QGIS and Esri ArcGIS in terms of advantages and disadvantages?

## When to use each?

We use QGIS (open sourced free to use software) as an example to compare with Python

| Aspect                          | QGIS                                                          | Python                      |
| ------------------------------- | ----------------------------------------------------------------------------- | --------------------------------------------------------------- |
| **Ease of learning**            | Easy to start. Visual interface lowers the entry barrier.                     | Steeper learning curve. Requires coding skills and debugging.   |
| **Transparency of workflow**    | Lower. Many steps are hidden behind tools and dialogs.                        | High. Every step is explicit in code and fully traceable.       |
| **Reproducibility**             | Limited. Workflows rely on manual clicks unless models are saved.             | Strong. Scripts can be rerun exactly and shared easily.         |
| **Automation**                  | Weak by default. Repetitive tasks require manual repetition or Model Builder. | Strong. Loops and functions make large-scale automation simple. |
| **Scalability**                 | Best for small to medium datasets and one-off analyses.                       | Better for large datasets and repeated processing.              |

---

# GIS tools vs Python

.left_half[
Python turns geospatial analysis from a manual, click-based process into **a reproducible, automated, and scalable workflow**.

.right_half[

### Naming and File Path Guidelines  

- Ensure that file paths do **not contain spaces or non-ASCII characters** (e.g., Chinese characters).

- **Use underscores _ in naming:** This is recommended in the [PEP 8 style guide](https://peps.python.org/pep-0008/#function-and-variable-names).  

**Why follow these guidelines?**  

1. **Spaces in names:** Variable names cannot contain spaces, and spaces in file names can cause issues, particularly in command-line environments.  

2. **Non-ASCII characters:** Different operating systems and file systems handle non-ASCII characters inconsistently, which can lead to problems when sharing files across platforms.

## File path

When Python reads files from another directory, it uses paths. There are two main types: absolute paths and relative paths. Understanding the parent directory helps avoid file not found errors.

### Absolute directory/path

An absolute path gives the full location of a file, starting from the root of the system.

```bash
# Windows
"C:/Users/<UserName>/project/data/input.csv"

# Linux / macOS
"/home/<UserName>/project/data/input.csv"
```

---

### Relative directory/path

```bash
"data/input.csv"
```

This means:

Look for data/ inside the current working directory.

Example folder structure:

```css
project/
├─ data/
│  └─ input.csv
└─ scripts/
   └─ analysis.ipynb
```

If `analysis.ipynb` is inside `scripts/` and needs `input.csv`:

```python
"../data/input.csv"
```

### Libraries: Numpy

**[Numpy](https://numpy.org/)**: core library for **numerical computing** in Python. It provides fast, efficient array operations, mathematical functions, and tools for linear algebra and random number generation.

Imagine a city divided into a 5x5 grid of zones. And each value represents the population in that zone

.right_half[
  <figure>
    <img src="imgs/numpy/numpy_simple_example.jpg" width="100%">
  </figure>
]
  ```python
  import numpy as np
  population_grid = np.array([
      [1200, 1500, 1300, 1600, 1400],
      [1100, 1700, 1250, 1550, 1350],
      [1000, 1400, 1200, 1500, 1300],
      [900, 1300, 1150, 1450, 1250],
      [800, 1200, 1100, 1400, 1200]
  ])

  zone_area_km2 = 2

  # Calculate population density per zone
  density_grid = population_grid / zone_area_km2
  print("Population density per zone (people/km²):\n", density_grid)
  ```

### Python libraries in Urban Data Science  

Representative libraries include:  
   - **[GeoPandas](https://geopandas.org/en/stable/getting_started.html):** Extends pandas to support spatial operations on geometric types.  
   - **[NetworkX](https://networkx.org/):** Models and analyses the structure of networks. 
   - **[PySAL](https://pysal.org/explore/):** A library for spatial data analysis.  
   - **[Geopy](https://geopy.readthedocs.io/en/stable/):** Enables geocoding and geospatial calculations.  
   - **[Folium](https://python-visualization.github.io/folium/latest/):** Creates interactive maps using Leaflet.  
   - **[Cartopy](https://scitools.org.uk/cartopy/docs/latest/):** Focuses on cartographic projections and geospatial data visualisation.  
   - **[Shapely](https://shapely.readthedocs.io/en/stable/):** Enables manipulation and analysis of planar geometric objects.  
   - **[PyProj](https://pyproj4.github.io/pyproj/stable/):** Provides cartographic projections and coordinate transformations.  
   - **[Fiona](https://fiona.readthedocs.io/en/stable/):** Facilitates reading and writing vector data.  
   - **[Rasterio](https://rasterio.readthedocs.io/en/stable/):** Supports reading and writing geospatial raster data.  
   - **[GDAL](https://gdal.org/en/stable/):** Handles raster and vector geospatial data formats.  

We will cover use cases of some of these libraries. More importantly, we will explore how to utilise them to address research questions encountered in urban research.
