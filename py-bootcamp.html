The session will cover the fundamental concepts of spatial analysis, types of spatial data, and the formulation of related research questions in urban studies.

In the following weeks, vector, raster, and network, three main types of spatial data, will be introduced, along with their respective analysis techniques and applications in urban contexts.

# GIS tools vs Python

How does **Python-based geospatial analysis** compare with **GUI-based GIS software** such as QGIS and Esri ArcGIS in terms of advantages and disadvantages?

## When to use each?

We use QGIS (open sourced free to use software) as an example to compare with Python

| Aspect                          | QGIS                                                          | Python                      |
| ------------------------------- | ----------------------------------------------------------------------------- | --------------------------------------------------------------- |
| **Ease of learning**            | Easy to start. Visual interface lowers the entry barrier.                     | Steeper learning curve. Requires coding skills and debugging.   |
| **Transparency of workflow**    | Lower. Many steps are hidden behind tools and dialogs.                        | High. Every step is explicit in code and fully traceable.       |
| **Reproducibility**             | Limited. Workflows rely on manual clicks unless models are saved.             | Strong. Scripts can be rerun exactly and shared easily.         |
| **Automation**                  | Weak by default. Repetitive tasks require manual repetition or Model Builder. | Strong. Loops and functions make large-scale automation simple. |
| **Scalability**                 | Best for small to medium datasets and one-off analyses.                       | Better for large datasets and repeated processing.              |

---

# GIS tools vs Python

| Aspect                          | QGIS                                                         | Python                       |
| ------------------------------- | ----------------------------------------------------------------------------- | --------------------------------------------------------------- |
| **Exploratory analysis**        | Very strong. Immediate visual feedback supports exploration.                  | Weaker at first. Requires plotting and inspection steps.        |
| **Spatial operations**          | Rich built-in tools for vector and raster analysis.                           | Powerful but library-dependent (GeoPandas, Shapely, Rasterio).  |
| **Integration with other data** | Limited. Non-spatial data integration is less flexible.                       | Strong. Easy to combine spatial, tabular, API, and sensor data. |
| **Custom methods**              | Hard. Custom logic is constrained by available tools.                         | Easy. Users can design new methods and workflows.               |
| **Performance control**         | Limited control over optimisation.                                            | High control. Users can optimise logic and memory use.          |
| **Collaboration**               | Project files can be shared, but changes are hard to track.                   | Code works well with version control such as Git.               |
| **Typical use cases**           | Teaching basics, map production, quick spatial analysis.                      | Research, automation, pipelines, advanced analysis.             |

Spatial analysis can be easily defined as quantitative analysis of spatial data.

It can be disaggregated into two key components: quantitative analysis and spatial data. The former describes a general approach, while the latter

Let's first focus on quantitative analysis. 
In general, quantitative analysis of spatial data involves two main aspects: describing patterns and understanding relationships.

## Raster with QGIS

Raster layers need more parameters and structure, so QGIS uses specialized tools to ensure they’re correctly set up.

You need to define resolution, extent, data type (e.g., integer, float), and sometimes initial values.

--

<xL>You can also create drawing using raster layer if you want.</xL>

---

## Comparison: Vector and Raster Data Model

Rule of Thumb:

- Use vector for objects with **clear boundaries and relationships**.

- Use raster for **continuous data** or when performing spatial modeling that requires **grid-based calculations**.

## Extended Definition of Spatial Analysis

### Spatial data analysis

Understanding the **spatial distribution, patterns, and relationships** within the data.

<br>

### Spatial statistical analysis

To test whether the spatial dataset exhibits **significant patterns or relationships**.

Location is analysed as an attribute on top of conventional data analysis.

<br>

### Spatial modelling

Models to **explain or predict spatial phenomena** by simulating real-world processes or evaluating different scenarios

<br>

### Spatial data manipulation

**Creation, transformation, and management** of spatial data

## From Exploration to Explanation

Different spatial analysis projects have different aims, so the framework must align the aim with the methods. 

| | **Exploratory**                                    | | **Descriptive**                                     | | **Explanatory**                                     |
|-| ------------------------------------------------------------ |-| ------------------------------------------------------------ |-| ------------------------------------------------------------ |
|*| Aim -> |*| Aim -> |*| Aim -> |
| | To discover patterns, trends, or anomalies in spatial data without starting from a clear hypothesis. | | To characterise and summarise spatial phenomena, often through quantification and comparison. | | To understand causation or association between spatial variables and to test hypotheses. |
|*| Example -> |*| Example -> |*| Example -> |
| | “What spatial patterns emerge from mapping daily pedestrian movement across Singapore's park network?” | | “How does accessibility to hawker centres vary across housing types in Singapore?” | | “To what extent do covered linkways influence the frequency of pedestrian movement across urban neighbourhoods?" |
