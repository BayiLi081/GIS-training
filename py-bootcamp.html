# GIS tools vs Python

How does **Python-based geospatial analysis** compare with **GUI-based GIS software** such as QGIS and Esri ArcGIS in terms of advantages and disadvantages?

## When to use each?

We use QGIS (open sourced free to use software) as an example to compare with Python

| Aspect                          | QGIS                                                          | Python                      |
| ------------------------------- | ----------------------------------------------------------------------------- | --------------------------------------------------------------- |
| **Ease of learning**            | Easy to start. Visual interface lowers the entry barrier.                     | Steeper learning curve. Requires coding skills and debugging.   |
| **Transparency of workflow**    | Lower. Many steps are hidden behind tools and dialogs.                        | High. Every step is explicit in code and fully traceable.       |
| **Reproducibility**             | Limited. Workflows rely on manual clicks unless models are saved.             | Strong. Scripts can be rerun exactly and shared easily.         |
| **Automation**                  | Weak by default. Repetitive tasks require manual repetition or Model Builder. | Strong. Loops and functions make large-scale automation simple. |
| **Scalability**                 | Best for small to medium datasets and one-off analyses.                       | Better for large datasets and repeated processing.              |

---

# GIS tools vs Python

| Aspect                          | QGIS                                                         | Python                       |
| ------------------------------- | ----------------------------------------------------------------------------- | --------------------------------------------------------------- |
| **Exploratory analysis**        | Very strong. Immediate visual feedback supports exploration.                  | Weaker at first. Requires plotting and inspection steps.        |
| **Spatial operations**          | Rich built-in tools for vector and raster analysis.                           | Powerful but library-dependent (GeoPandas, Shapely, Rasterio).  |
| **Integration with other data** | Limited. Non-spatial data integration is less flexible.                       | Strong. Easy to combine spatial, tabular, API, and sensor data. |
| **Custom methods**              | Hard. Custom logic is constrained by available tools.                         | Easy. Users can design new methods and workflows.               |
| **Performance control**         | Limited control over optimisation.                                            | High control. Users can optimise logic and memory use.          |
| **Collaboration**               | Project files can be shared, but changes are hard to track.                   | Code works well with version control such as Git.               |
| **Typical use cases**           | Teaching basics, map production, quick spatial analysis.                      | Research, automation, pipelines, advanced analysis.             |

**Quantitative analysis**:

???

Spatial analysis can be easily defined as quantitative analysis of spatial data.

It can be disaggregated into two key components: quantitative analysis and spatial data. The former describes a general approach, while the latter
specifies the type of data being analyzed.

Let's first focus on quantitative analysis. 
In general, quantitative analysis of spatial data involves two main aspects: describing patterns and understanding relationships.

## Data Types and Structures

We will begin by introducing some of the most commonly used data types in Python, such as **number (integers, floats)**, and ** text (strings**, which form the foundation for handling different kinds of information in programming.

Understanding these data types is essential for performing calculations, managing text, and working with various types of data.

In addition to these fundamental data types, we will explore two versatile and widely used data structures: lists and dictionaries.

---

### List

Lists allow you to store and manage collections of items in an ordered sequence, making it easier to perform operations like iteration and indexing.

---

### Dictionary

Dictionaries enable you to store data in a key-value format, offering a flexible way to organise and retrieve information efficiently.
