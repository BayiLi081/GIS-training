## Overlay

The ability to integrate data from two or more sources using map overlay is one of the key GIS analysis functions.

Using GIS we can overlay two different thematic map layers of the same area and overlay them one on top f the other to form a new layer.
Map overlay has many applications:

- It can be used for the visual comparison of data layers

- It can be used to create new spatial datasets by merging two or more input data layers

--

The analytical method to answer this kind of questions:

<xL>"Which grocery shops are within 200 m of my home?"</xL>

--

### Spatial Join vs. Overlay

.left_half[
  ### Spatial Join

  Attribute data
  
  Attributes from one dataset are appended to those in another dataset based on a specified relative spatial relationship.

  it may or may not produce the same output as overlay

  retains the same features on the output
]

.right_half[
  ### Overlay
  
  Combines both spatial and attribute data from two layers to create a new layer.

  a new set of features based on the geometric intersection of the two input layers.
]

## Distance

### Planar vs. Geodesic Distance

[Youtube: Why Don't Planes Fly in a Straight Line?](https://www.youtube.com/shorts/9gJkAT3Dkxw "is:video")

<br>

| Feature              | Planar Distance                     | Geodesic Distance                      |
|----------------------|--------------------------------------|----------------------------------------|
| **Earth Model**      | Flat plane                          | Curved surface (ellipsoid/sphere)     |
| **Accuracy**         | Lower over large areas              | High accuracy globally                |
| **Use Case**         | Local mapping, engineering          | Navigation, global analysis           |
| **Coordinate System**| Projected (e.g., UTM)               | Geographic (e.g., WGS84)              |
| **Computation**      | Simpler, faster                     | More complex, slower                  |
