## Why Spatial Data Cleaning Matters

Spatial analysis is only as reliable as the data that enters it.

- Incorrect CRS can produce wrong distances and overlays
- Broken geometries can make operations fail
- Poor field structure makes joins and mapping harder
- Messy source formats slow down later analysis

Cleaning is not a minor preparation step. It is part of the analytical method.

---

## What Needs Cleaning in Spatial Data?

Spatial data usually combines two parts:

1. **geometry**: points, lines, polygons, or raster cells
2. **attributes**: names, IDs, categories, counts, dates, or descriptions

Problems may occur in either part, and often in both at once.

## Common Data Problems

Typical issues include:

- missing or incorrect CRS
- invalid geometries
- inconsistent attribute names or encodings
- nested or badly structured attribute values
- duplicated features
- mismatched identifiers for joins
- source data designed for display rather than analysis

## Coordinate Reference Systems (CRS)

It is essential to work with the correct CRS before measuring, buffering, overlaying, or mapping.

<div align="center">

## Geographic vs Projected CRS

- **Geographic CRS** stores locations on the globe, often in latitude and longitude
- **Projected CRS** converts the earth surface into planar coordinates, often in metres

With projected CRS, distances and areas can usually be handled in more appropriate linear units for analysis.

*Note:* Different projections introduce different distortions. A CRS suitable for display is not always the best CRS for analysis.

## EPSG Codes and Singapore

EPSG codes are unique identifiers linked to specific coordinate reference systems.

## Common Spatial Vector Data Formats

Esri Shapefile

A full Esri Shapefile is not one file. It is a set of files that must stay together in the same folder.

**`.shp`**

* Stores the geometry (points, lines, or polygons).

**`.shx`**

* Index file.

**`.dbf`**

* Attribute table.
* Stores non-spatial data (names, IDs, values).

**`.prj`**

* Stores the coordinate reference system (CRS).
* Without it, the data has no defined projection.

## GeoJSON

- A single text file: Easy to open, share, and inspect.

- Human-readable (JSON format)

- Designed for the web: 

  Works well with JavaScript, Python, and web maps.

- Slower and heavy for large datasets. 
  
  Best for small to medium data.

---

## KML

KML (Keyhole Markup Language)

- A single text file based on XML.

- Designed for visualisation, not analysis.

- Closely linked to Google Products.

- Uses WGS84 (lat–lon) only

## Read and Save Spatial Files in Python

```python
file_path = "path_to_file/your_geospatial_data"
file_data = gpd.read_file(file_path)
```

Refer to [Official Documentation: Read files](https://geopandas.org/en/stable/docs/reference/api/geopandas.read_file.html)

### Save GeoDataFrame as Local Files

Usually to specify a driver when writing

```python
file_path = "path_to_file/your_geospatial_data"

# 1. Save as ESRI Shapefile
file_gpd.to_file(f"{file_path}.shp", driver="ESRI Shapefile")

# 2. Save as GeoJSON
file_gpd.to_file(f"{file_path}.geojson", driver="GeoJSON")

# 3. Save as KML (requires fiona support)
file_gpd.to_file(f"{file_path}.kml", driver="KML")
```

Refer to [Official Documentation: Write files](https://geopandas.org/en/stable/docs/reference/api/geopandas.GeoDataFrame.to_file.html)

name: workflow

## Recommended Cleaning Workflow

1. inspect the dataset and metadata
2. confirm or repair CRS
3. inspect geometry validity and field structure
4. rename, recode, or extract attributes as needed
5. remove duplicates or irrelevant fields
6. export to a cleaner working format such as GeoPackage or GeoJSON
7. document every transformation

---

## Practical Workflow in QGIS and Python

- Use **QGIS** for quick inspection, geometry checks, field review, and visual verification
- Use **Python** for repeatable parsing, field cleaning, batch conversion, and automation
- Use **both together** when the dataset is spatial but the attribute issues are too complex for manual editing

This combined workflow is often the most effective in urban GIS practice.

## Key Takeaways

- Spatial data cleaning is part of analysis, not a separate afterthought.
- CRS, geometry validity, and attribute structure must be checked before spatial operations.
- Shapefile, GeoJSON, and KML serve different purposes and carry different constraints.
- QGIS is useful for inspection and repair, while Python is useful for reproducible transformation.
- Clean, documented spatial data makes later cartography and spatial analysis more reliable.
