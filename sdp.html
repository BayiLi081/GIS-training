## **Geographic and Projected** Coordinate Referece Systerm (CRS)

It is important that you are working with **the correct CRS**.

<div align="center">
    <img src="imgs/vector/gcs_pcs.png">
    <br>Source: https://www.esri.com/arcgis-blog/products/arcgis-pro/mapping/gcs_vs_pcs/
</div>

Anyway, with **projected CRS**, we can express the location in the **unit: metres**.

*Note:* You can go to this website: [Interactive Album of Map Projections 2.0 (psu.edu)](https://projections.mgis.psu.edu/), check the difference of projected CRSs. Different CRS may introduce bias. For example, you can go to [How big the world actually is: The true size](https://www.thetruesize.com/) to check the distortion it gives to real size.

## **Geographic and Projected** Coordinate Referece Systerm (CRS)

EPSG is the unique ID linked to a specific coordinate reference system.

The common coordinate systems and their EPSG codes

- EPSG: 4326
- EPSG: 3857
- EPSG: 7789

Recommended EPSG codes for Singapore:

[Coordinate reference systems for "Singapore" (epsg.io)](https://epsg.io/?q=Singapore)

### Common spatial vector data formats

Esri Shapefile

A full Esri Shapefile is not one file. It is a set of files that must stay together in the same folder.

**`.shp`**

* Stores the geometry (points, lines, or polygons).

**`.shx`**

* Index file.

**`.dbf`**

* Attribute table.
* Stores non-spatial data (names, IDs, values).

**`.prj`**

* Stores the coordinate reference system (CRS).
* Without it, the data has no defined projection.

### Common spatial vector data formats

GeoJSON

- A single text file: Easy to open, share, and inspect.

- Human-readable (JSON format)

- Designed for the web: 

  Works well with JavaScript, Python, and web maps.

- Slower and heavy for large datasets. 
  
  Best for small to medium data.

---

### Common spatial vector data formats

KML (Keyhole Markup Language)

- A single text file based on XML.

- Designed for visualisation, not analysis.

- Closely linked to Google Products.

- Uses WGS84 (lat–lon) only

### Read Local Files as GeoDataFrame

```python
file_path = "path_to_file/your_geospatial_data"
file_data = gpd.read_file(file_path)
```

Refer to [Official Documentation: Read files](https://geopandas.org/en/stable/docs/reference/api/geopandas.read_file.html)

### Save GeoDataFrame as Local Files

Usually to specify a driver when writing

```python
file_path = "path_to_file/your_geospatial_data"

# 1. Save as ESRI Shapefile
file_gpd.to_file(f"{file_path}.shp", driver="ESRI Shapefile")

# 2. Save as GeoJSON
file_gpd.to_file(f"{file_path}.geojson", driver="GeoJSON")

# 3. Save as KML (requires fiona support)
file_gpd.to_file(f"{file_path}.kml", driver="KML")
```

Refer to [Official Documentation: Write files](https://geopandas.org/en/stable/docs/reference/api/geopandas.GeoDataFrame.to_file.html)

### Overlay with Python

.left_half[

[Table Join](data.html#join)

- A and B (Inner Join)

  ```python
  x.intersection(y)
  ```

- A or B (Full Join)

  ```python
  x.union(y)
  ```

- A not B (Left Join)

  ```python
  x.difference(y)
  ```

- A xor B

  ```python
  x.symmetric_difference(y)
  ```

### Route Query using OneMap

OneMap has different routing options including public transport, drive, walk and cycle.

.left_half[

[Public Transport](https://www.onemap.gov.sg/apidocs/routing/#publicTransport)

```python
import requests
    
url = "https://www.onemap.gov.sg/api/public/routingsvc/route?date=11-10-2025&mode=TRANSIT&maxWalkDistance=1000&numItineraries=3&routeType=pt&time=11%3A19%3A47&start=1.3081592%2C103.8551479&end=1.2739864%2C103.8012642"
    
headers = {"Authorization": "**********************"}
    
response = requests.request("GET", url, headers=headers)
    
print(response.text)
```
]
