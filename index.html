The session will cover the fundamental concepts of spatial analysis, types of spatial data, and the formulation of related research questions in urban studies.

In the following weeks, vector, raster, and network, three main types of spatial data, will be introduced, along with their respective analysis techniques and applications in urban contexts.

---

## Course Overview

This course focuses on GIS in the urban context.

- Apply GIS tools to analyse, model, and visualise urban geospatial data
- Build core skills in data collection, management, and visualisation
- Work across vector, raster, and network-based spatial analysis
- Use QGIS and Python-based workflows, with Python introduced through Google Colab

---

## GeoAI And Final Project

GeoAI will be introduced as a practical extension of GIS workflows.

- Support mapping, spatial analysis, and interpretation of urban patterns
- Apply these methods in a group project on a real urban issue in Singapore
- Work with geospatial datasets from publicly available government data sources
- Publish a reusable workflow as an open-source project
- Critically assess the assumptions, limitations, and risks of AI-assisted geospatial analysis

---

## Intended Learning Outcomes

By the end of this course, students should be able to:

1. Explain fundamental GIS concepts and distinguish between major types of spatial data
2. Apply GIS methods to analyse vector, raster, and network-based geospatial data
3. Create maps and visual outputs to communicate spatial information clearly
4. Apply basic spatial statistical methods to interpret spatial patterns and relationships
5. Design a reusable analytical workflow for investigating a real-world urban issue
6. Use GeoAI critically and work in a group to publish a transparent and reproducible open-source workflow

---

## Week 1 Focus

In this lecture, students will be introduced to the course structure, intended learning outcomes, and assessment methods.

- What GIS is and why it matters in urban analysis
- Core GIS concepts, including the history and components of GIS
- Fundamentals of spatial data, including types, formats, and acquisition methods
- A first light introduction to QGIS
- An overview of how Python will be used later through Google Colab

---

## Week 1 Take-Home Tasks

- Install QGIS
- Explore the QGIS interface
- Ensure access to a Google account for future Python exercises in Google Colab

## Assessment

The course combines continuous and summative assessment across the term.

| Component | Weight | Period |
|---|---|---|
| Participation | 10% | Throughout the term |
| Individual Assignment (Spatial Data Processing, Part I & II) | 20% | Weeks 3–9 |
| Final group project presentation | 20% | Week 14 |
| Final group project code | 20% | Week 14 |
| Final individual report | 30% | Week 14 |

The final group project accounts for 70% of the overall grade.

---

## Final Project

**Spatial Analysis for a real-world urban issue in Singapore** (70%, Weeks 9–14)

Each group defines a focused Singapore-based urban question, justifies why it matters, and develops a spatial argument using open government datasets, appropriate methods, and critical interpretation.

Possible themes:

- Transport accessibility and daily mobility
- Housing, land use, and neighbourhood change
- Distribution of public amenities and services
- Environmental quality, green space, and liveability
- The role of data and AI-assisted interpretation in policy discussion

Delivered as three outputs: a presentation slide deck, a 6–8 page report, and reproducible, open-source project code.

---

| Week 10 | Review studies, plan the project, begin the analytical workflow |
| Week 11 | Collect and integrate the datasets for the workflow |
| Week 12 | Conduct spatial analysis, produce and visualise results |
| Week 13 | Prepare the presentation and report in tutorials |
| Week 14 | 15-min presentation + 5-min Q&A |

## Raster with QGIS

Raster layers need more parameters and structure, so QGIS uses specialized tools to ensure they’re correctly set up.

You need to define resolution, extent, data type (e.g., integer, float), and sometimes initial values.

--

<xL>You can also create drawing using raster layer if you want.</xL>

---

## Comparison: Vector and Raster Data Model

Rule of Thumb:

- Use vector for objects with **clear boundaries and relationships**.

- Use raster for **continuous data** or when performing spatial modeling that requires **grid-based calculations**.

|             |         | Raster                                      |         |Vector |
|-------------|---------|---------------------------------------------|---------|------------------------------------------------------|
|Advantages   | *  | Simple Data Structure                       | *  | More compact                                         |
|             | *  | Efficiency in overlay operations            | *  | Efficiency in topology-based operations              |
|             | *  | Better representing high spatial variability| *  | Better map visualisation                             |
|             | *  | Widely used in remote sensing and image data|      |                                                      |
|Disadvantages| *  | Less compact                                | *  | More complex                                         |                                         
|             | *  | Underrepresented topological relationship   | *  | Inefficient representation of high spatial variablity|
|             | *  | Disadvantages in visualisation              | *  | Unable to handle image data                          |
|             | *  | Less compact                                |      |                                                      |

## Extended Definition of Spatial Analysis

### Spatial data analysis

Understanding the **spatial distribution, patterns, and relationships** within the data.

### Spatial statistical analysis

To test whether the spatial dataset exhibits **significant patterns or relationships**.

Location is analysed as an attribute on top of conventional data analysis.

### Spatial modelling

Models to **explain or predict spatial phenomena** by simulating real-world processes or evaluating different scenarios

### Spatial data manipulation

**Creation, transformation, and management** of spatial data

## From Exploration to Explanation

Different spatial analysis projects have different aims, so the framework must align the aim with the methods. 

| | **Exploratory**                                    | | **Descriptive**                                     | | **Explanatory**                                     |
|-| ------------------------------------------------------------ |-| ------------------------------------------------------------ |-| ------------------------------------------------------------ |
|*| Aim -> |*| Aim -> |*| Aim -> |
| | To discover patterns, trends, or anomalies in spatial data without starting from a clear hypothesis. | | To characterise and summarise spatial phenomena, often through quantification and comparison. | | To understand causation or association between spatial variables and to test hypotheses. |
|*| Example -> |*| Example -> |*| Example -> |
| | “What spatial patterns emerge from mapping daily pedestrian movement across Singapore's park network?” | | “How does accessibility to hawker centres vary across housing types in Singapore?” | | “To what extent do covered linkways influence the frequency of pedestrian movement across urban neighbourhoods?" |

<br>
