*Data source: [Traffic Images by LTA](https://data.gov.sg/datasets/d_6cdb6b405b25aaaacbaf7689bcc6fae0/view#GET/transport/traffic-images)*

- **The vehicles:** is traffic pressure building, and when?
- **The planters:** how much greenery does someone on this route see?

name: traffic-pressure

## Traffic: Where Should We Investigate Queues?

.right_half[
<figure>
<img src="data/sg_traffic_images/images/cam_2702.jpg" alt="Singapore traffic camera 2702 showing vehicles on an expressway" class="zoomable" width="100%">
<figcaption>What can this single view establish?</figcaption>
<figsubcaption>LTA traffic images via data.gov.sg; teaching sample, 18 Nov 2026.</figsubcaption>
</figure>
]

The vehicles in the opening view raise the first question. Queues affect bus reliability, access to services, and how easy a road is to cross.

A single frame can tell us **how many vehicles are visible** on a defined stretch of road. 

It cannot tell us how long a queue lasts or how fast it moves. It might need continuous observation.

We start by counting with **object detection**, then ask what extra observation turns a count into flow.

name: tools-intro

## Before the Notebook: Models, Weights, and Two Libraries

.left_half[

.cv-compact-table[

| Term | What It Means Here |
|---|---|
| **Model** | the architecture, a recipe of layers: RT-DETR, YOLO, SegFormer |
| **Weights** | the numbers learned in training, saved as a file and downloaded once |
| **Pretrained** | already trained by someone else on a large dataset (COCO, Cityscapes) |
| **Inference** | running a trained model on new images; we do not train in class |
| **Threshold** | the minimum confidence score for keeping a box |

]

**Same model, different weights, different skills:** COCO weights know cars and buses; Cityscapes weights know road, sidewalk and vegetation.
]

.right_half.cv-code-small[

**Hugging Face `transformers`:** `pipeline` downloads the weights, resizes the image, runs the model and returns labelled results in one call.

```python
from transformers import pipeline
detector = pipeline("object-detection",
                    model="PekingU/rtdetr_v2_r18vd")
detector(img, threshold=0.5)  # [{label, score, box}, ...]
```

**Ultralytics `YOLO`:** one object to predict, track, train, and export.

```python
from ultralytics import YOLO
model = YOLO("yolo26s.pt")     # s = small; also n, m, l, x
model.predict(img, conf=0.25)  # boxes, classes, scores
```

.cv-small[`model=` names a checkpoint on the [Hugging Face Hub](https://huggingface.co/models) as `publisher/model`; change it to try another model.]
]

<div style="clear: both"></div>

---

## Detect Vehicles: Turn Boxes into a Defined Count

**Question:** how many vehicles are visible inside the same road area at each observation time?

.cv-compact-table[

| Stage | Method | Check Before Interpreting |
|---|---|---|
| Locate objects | RT-DETR and YOLO in the notebook: compare before choosing | boxes can miss small or occluded vehicles |
| Select classes | retain specified vehicle labels | document whether bicycles and motorcycles are included |
| Define the count | filter to a fixed road region and confidence threshold | the notebook counts the full image; add a region for a traffic study |
| Validate | compare with manual boxes and counts | report misses, false detections, and count error |

]

**Output:** visible vehicle count per image and timestamp. Different camera views cover different road areas, so raw counts are not directly comparable traffic-density measurements.

.cv-small[
**Try notebook section 3:** run both detectors on camera 4703 and check them against your own count. This is inference with pretrained weights, not local model training.
]

.references[
- [RT-DETRv2 model and COCO training information](https://huggingface.co/PekingU/rtdetr_v2_r18vd)
- [Ultralytics detection task](https://docs.ultralytics.com/tasks/detect/)
]

## Need Flow? Add Time and Track Crossings

**Urban question:** how many vehicles or pedestrians pass a defined line during an observation interval?

.left_half[
<iframe
    class="cv-video-frame"
    src="https://www.youtube-nocookie.com/embed/OS5qI9YBkfk"
    title="Roboflow: Track and Count Objects using YOLOv8, ByteTrack and Supervision"
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="encrypted-media; picture-in-picture; fullscreen"
    allowfullscreen>
</iframe>
.cv-small[Video: Roboflow, [Track & Count Objects using YOLOv8, ByteTrack & Supervision](https://www.youtube.com/watch?v=OS5qI9YBkfk).]
]

.right_half[
**Detect → track → count:** the tracker keeps one ID per vehicle across frames, so each crossing is counted once, with its direction.

.cv-compact-table[

| Measure | Needs |
|---|---|
| Snapshot count | one image |
| Crossing rate | unique crossings in a timed interval |
| Typical flow | repeated, representative periods + independent counts |

]

**Check:** ID switches, occlusion, missed frames. API snapshots may be too far apart to track.
]

<div style="clear: both"></div>

.references[
- Yin et al. (2015), [‘Big data’ for pedestrian volume](https://doi.org/10.1016/j.apgeog.2015.07.010), Applied Geography, 63, 337–345.
- [Ultralytics tracking mode](https://docs.ultralytics.com/modes/track/) · [Six trackers compared on ID stability (video)](https://www.youtube.com/watch?v=ZsxHIN2PoiY)
]

???
In the video, point to the counting line and the in/out counter, and to the IDs that stay with each vehicle across frames.
The supplied eight-camera sample contains one observation per camera, so it cannot demonstrate tracking across time. Tracking IDs are temporary associations, not personal identities. Yin et al. investigate estimation of pedestrian volume; the teaching distinction is between a raw snapshot count and a separately validated flow estimate.

name: street-greenery

## Greenery: Which Walking Routes Need Attention?

.right_half[
<figure>
<img src="imgs/applygis/svi_nus.webp" alt="Street-level imagery illustrating the pedestrian view of an urban street" class="zoomable" width="100%">
<figcaption>The viewpoint matters when measuring visible greenery.</figcaption>
<figsubcaption>Source: NUS Global Streetscapes, https://ual.sg/project/global-streetscapes/</figsubcaption>
</figure>
]

In the opening view, the greenery is a row of planters and a verge. Is that typical of the route? A greening programme needs evidence at the scale of the street: **which walking routes have little visible greenery?**

We measure it with **semantic segmentation**, which labels vegetation pixels; GIS then joins their share to walking routes.

The result is a shortlist for field visits, where shade, planting space, and who walks there can be checked.

---

## Green View Share: A Number with a Viewpoint

<div class="cv-flow">
<div><strong>Numerator</strong><br>pixels labelled vegetation</div>
<div><strong>Denominator</strong><br>all valid pixels in the chosen view</div>
<div><strong>Share</strong><br>vegetation pixels / valid pixels</div>
</div>

.cv-compact-table[

| Indicator | Observation | Urban Question |
|---|---|---|
| Eye-level Green View Index (GVI) | consistently sampled street-level views | how much greenery is visible along a walking route? |
| Traffic-camera green share | elevated camera field of view | how much of this camera image is vegetation? |
| NDVI | red and near-infrared reflectance | where is photosynthetically active vegetation evident in the raster? |

]

**For comparability:** use consistent viewpoints, directions, cropping, seasons, vegetation classes, and invalid-pixel rules. Panorama projection also affects pixel weighting.

**For heat mitigation:** add shade observations and temperature or thermal-comfort evidence; visible greenery alone does not measure cooling.

name: pedestrian-access

## Pedestrian Access: Where Should We Inspect?

The red path in the opening view looks walkable. On the ground, a path that is mapped or visible may still be narrow, broken, or blocked.

.cv-compact-table[

| Inspection Question | Technology | Reviewable Output |
|---|---|---|
| Is a path visible in this view? | image classification | visible / not visible / uncertain |
| Where are obstacles and path surfaces? | detection + segmentation | boxes and masks linked to the image |
| Which visible features explain the flag? | vision-language model (VLM) | structured audit answer with visual evidence |
| Is there enough usable space? | calibrated geometry + field measurement | verified dimensions and access conditions |

]

Images help **prioritise site visits** along routes to bus stops, schools, or clinics. They flag a site; they cannot certify it as accessible.

---

## Classification: Sort Views for a Pedestrian Audit

**Question:** which images should a reviewer inspect for a possible missing footpath?

<div class="cv-flow">
<div><strong>Define the labels</strong><br>visible / not visible / uncertain</div>
<div><strong>Classify the view</strong><br>image-level category</div>
<div><strong>Review the flags</strong><br>confirm against the image</div>
</div>

- Create a locally labelled sample with a clear audit rubric.
- Test on streets excluded from training; nearby duplicate views can inflate accuracy.
- Review false negatives: a missed problem may remove a route from the inspection list.
- Keep “uncertain” or request review when the view is obstructed.

**Output:** an image-level audit label. It does not locate an obstacle; use detection or segmentation for that.

.cv-small[
Custom labels require suitable training or an evaluated prompting workflow. Off-the-shelf scene classes do not automatically match this audit rubric.
]

---

## VLMs: Turn Visible Features into an Audit Record

.right_half[
<figure>
<img src="imgs/applygis/vlm_understanding.png" alt="Illustration of vision-language model capabilities" class="zoomable" width="100%">
<figcaption>VLMs accept images and language prompts.</figcaption>
<figsubcaption>Source: https://www.ultralytics.com/blog/understanding-vision-language-models-and-their-applications</figsubcaption>
</figure>
]

**Question:** what visible evidence suggests a path obstruction?

.cv-small[
**Example prompt:** “Is a pedestrian path visible? Is an obstruction visible on it? Return yes / no / uncertain for each, describe the supporting image region, and state what cannot be judged.”

**Technology:** a vision-language model connects image content with a natural-language request.

**Review:** compare answers with a human audit using the same rubric. Preserve the image ID, prompt, model version, and reviewer decision.

**Output:** a draft inspection record. Fluent descriptions can be wrong; verify the cited region and avoid inferring residents' traits or intentions.
]

name: urban-evidence

## Match the Imagery to the Urban Evidence Needed

.cv-compact-table[

| Urban Issue | Suitable Source | Observation Unit | Limitation to Resolve |
|---|---|---|---|
| Vehicle queues and crossings | traffic-camera images or video | fixed view + time interval | occlusion, view changes, insufficient frame frequency |
| Greenery along walking routes | street-view images | sampled point + direction + date | uneven routes, seasons, capture dates |
| Planting space and canopy | aerial imagery | georeferenced pixel / parcel | top-down view omits eye-level experience |
| Vegetation and surface heat patterns | suitable satellite spectral / thermal data | pixel / grid + acquisition date | resolution, clouds; surface heat is not felt heat |
| Reported place experience | volunteered or social images | contributed image + place | selective posting and uncertain representativeness |

]

**Choose the source after defining the question.** Combine complementary viewpoints with explicit dates and units; do not treat them as interchangeable measurements.

[Open-source directory](#visual-data-sources) · [Traffic API practice](#api-practice)

---

## Aggregate Observations to Useful GIS Units

**Question:** which streets need an inspection, and how much evidence supports each one?

.cv-compact-table[

| Observation | GIS Unit | Aggregation Rule | Keep Alongside the Value |
|---|---|---|---|
| green share per standardised view | walking street segment | summarise sampled views with stated weights | sample count, spread, dates, missing coverage |
| reviewed obstruction label | route / street segment | flag observed locations for inspection | evidence image, direction, review status |
| vehicle crossings per interval | counted line / approach | sum unique crossings over measured time | duration, direction, missing frames |
| scene class per image | neighbourhood sample | report class proportions among sampled views | sample design and uncertain labels |

]

**Spatial join:** retain image IDs and link observations to the intended street or site. Nearest-road matching can pick the wrong carriageway; camera position may differ from the scene observed.

**Avoid false precision:** broad averages can hide one obstructed link or a short stretch with low greenery.

---

## Combine Layers to Build an Inspection Shortlist

**Planning workflow:** identify walking routes with low observed greenery, then inspect routes that connect people to everyday services.

<div class="cv-flow">
<div><strong>Visual evidence</strong><br>greenery + reviewed access flags</div>
<div><strong>GIS context</strong><br>walking network + stops + destinations</div>
<div><strong>Field shortlist</strong><br>candidate routes + evidence gaps</div>
</div>

- Join observations to streets; map coverage before ranking.
- Add population, service access, and measured environmental conditions.
- State the prioritisation rule; test whether different weights change the shortlist.
- Visit candidate routes to check shade, usable space, and planting feasibility.

**For urban models:** match dates and units, evaluate on separate areas, and consider confounding.

---

name: takeaways

## Return to the Urban Questions

.cv-compact-table[

| Issue | Technology Contributes | What Our Sample Showed | Decision Still Needs |
|---|---|---|---|
| Traffic pressure | detection gives boxes; tracking gives temporal associations | queue at 4703; RT-DETR 9, YOLO 11, both miss many | defined observation intervals and validated movement measures |
| Street greenery | segmentation gives masks; GVI summarises a chosen view | opening view 4799 among the lowest (0.10) | representative routes, consistent viewpoints, field checks |
| Pedestrian access | classification and VLMs structure audits; geometry adds spatial evidence | path visible at 4799; edge posts uncertain | human review, verified dimensions, current site conditions |

]

**The reusable sequence:** urban question → suitable images → measurable output → local validation → GIS context → justified action.

**A good result says both what was observed and what remains unknown.**

name: image-raster

## Reference: From a Photograph to Model Input

.right_half[
<figure>
<img src="imgs/urbanCV/AI%26cv.jpeg" alt="Overview of artificial intelligence and computer vision" class="zoomable" width="100%">
<figcaption>Computer vision supplies the image measurements in our workflow.</figcaption>
</figure>
]

**An image is a raster:** our sample has 360 rows × 640 columns × 3 RGB bands.

- Pixel values encode colour; they do not directly label a car or a tree.
- A trained model turns visual patterns into boxes, masks, or labels.
- Resizing can make distant motorcycles too small to recognise.

**Keep a separate record:** image ID, camera ID, coordinates, capture time, viewpoint, and processing settings.

.cv-small[
A pixel location is not a map coordinate. Camera coordinates locate the observation point; locating objects on the ground needs camera geometry or other georeferencing.
]

---

name: svi-indexs

## Reference: Other Pixel Shares Help Frame Street Audits

.cv-compact-table[

| Visible Class | Image Measurement | Urban Use | Needs Additional Evidence |
|---|---|---|---|
| Vegetation | vegetation pixel share | identify low-greenery views | shade and planting feasibility |
| Sky | sky pixel share | compare visual openness | calibrated geometry for a sky-view factor |
| Road | road pixel share | describe the captured streetscape | mapped road area and perspective correction |
| Sidewalk | sidewalk pixel share | flag views for pedestrian-path review | usable width, continuity, obstructions |
| Building | building pixel share | describe visual enclosure | heights, setbacks, and street geometry |

]

**Pixel share measures the image.** It is not automatically ground-area share, pedestrian accessibility, or a physical dimension.

**Practical:** compare camera 2704 with 2701. Inspect what the segmentation model does with water before mapping any class shares.

---

## Reference: When the Question Needs More Than a Label

**Possible extensions:** select these only when the required observations and validation are available.

.cv-compact-table[

| Urban Investigation | Technology | Useful Output | Essential Check |
|---|---|---|---|
| Which objects occupy a kerbside area? | instance segmentation | separate masks for individual vehicles or objects | projected mask area is not ground area |
| How are vehicles arranged in an aerial parking view? | oriented bounding boxes (OBB) | boxes with orientation | aerial resolution, classes, and georeferencing |
| How do people move through a crossing? | pose estimation + temporal tracking | keypoints and movement sequences | occlusion, annotation quality; posture does not reveal intent |
| Could a path contain a narrow passage? | depth estimation + camera geometry | estimated scene geometry | scale calibration and field measurements before width claims |

]

**These are study-design options, not outputs of the supplied notebook.** Each requires task-specific models or additional processing.

name: yolo-modes

## Reference: YOLO Tasks and Modes

**YOLO = You Only Look Once.** In Ultralytics, a **task** defines the output; a **mode** defines the operation.

.cv-yolo-columns[
.cv-yolo-column[

### Urban question → task

| Task | Urban Observation |
|---|---|
| Detection | boxes + classes → locate vehicles |
| Instance segmentation | one mask per object → separate cars |
| Semantic segmentation | class per pixel → road / sky / greenery |
| Classification | image label → street scene type |
| Pose estimation | keypoints → pedestrian posture |
| Oriented boxes (OBB) | rotated boxes → aerial vehicle orientation |
| Depth estimation | depth per pixel → scene geometry |

]
.cv-yolo-column[

### Modes: what do you want to do?

| Mode | Purpose |
|---|---|
| **Train** | adapt to local traffic images |
| **Val** | check errors on labelled local views |
| **Predict** | detect vehicles in new observations |
| **Track** | link vehicles through video frames |
| **Export** | prepare the model for a camera device |
| **Benchmark** | compare device speed and accuracy |

]
]

.cv-yolo-note[
**Toolkit recap; the notebook compares YOLO with RT-DETR for detection and uses SegFormer for segmentation.** Choose compatible weights: task support depends on the model family, weights, and package version; one checkpoint does not perform every task. For greening, use vegetation classes; for flow, tracking needs sequential frames. Validate each task on local observations.

Sources: [Ultralytics tasks](https://docs.ultralytics.com/tasks/) · [Ultralytics modes](https://docs.ultralytics.com/modes/)
]

???

The task list follows the current Ultralytics documentation, including semantic segmentation and depth estimation. Older model families and package versions may support fewer tasks. Workflow modes are not universally available for every task; check the selected model's support matrix. Example: vehicle detection + Predict gives boxes in each image; vehicle detection + Track associates those boxes across consecutive video frames. Neither a snapshot count nor a track ID alone establishes representative traffic flow. Depth estimates also need local validation before use as physical measurements.
