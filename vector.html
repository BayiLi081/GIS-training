### Customised Buffering I

- Two primary types of buffers are available to the GIS users:

  - Constant width: require users to input a value by which features are buffered

  - Variable width: uses a premade buffer field within the attribute table to determine the buffer width for each specific feature in the dataset

- Linear features can be buffered on both sides of the line, only on the left, or only on the right. Linear features can also be buffered so that the end points of the line are rounded (ending in a half-circle) or flat (ending in a rectangle).


---

### Customised Buffering II

- Multiple ring buffers can be made such that a series of concentric buffer zones are created around the originating feature at user-specified distances

- Users can choose to dissolve or not dissolve the boundaries between overlapping, coincident buffer areas

---

### Customised Buffering III

.left_half[A doughnut buffer is a buffer around a polygon feature that does not include the area inside the buffered polygon.]

.right_half[Setback buffers are similar to doughnut buffers; however, they only buffer the area inside of the polygon boundary.]

## Overlay

The ability to integrate data from two or more sources using map overlay is one of the key GIS analysis functions.

Using GIS we can overlay two different thematic map layers of the same area and overlay them one on top f the other to form a new layer.
Map overlay has many applications:

- It can be used for the visual comparison of data layers

- It can be used to create new spatial datasets by merging two or more input data layers

--

The analytical method to answer this kind of questions:

<xL>"Which grocery shops are within 200 m of my home?"</xL>

--

Combined with buffering, we can answer the question in following steps:

1. we first buffer home with 200m distance

2. then we do an overlay to combine grocery shop data with home data

### Overlay Methods

One of the overlay datasets must always be a line or polygon layer, while the second may be point, line, or polygon.

1. point-in-polygon

2. polygon-on-point

3. line-on-line

4. line-in-polygon

5. polygon-on-line

6. polygon-on-polygon

#### Overlay with Boolean operators

Overlay methods can be more complex than that and therefore employ the basic Boolean operators:

1. Intersection (AND)

  Keeps only the areas where both layers overlap.

2. Union (OR)

  Combines all features from both layers, including overlaps and non-overlaps.

3. Difference (NOT)

  Removes areas of overlap from one layer based on another.

4. Symmetrical Difference (XOR)

  Keeps only the areas that are in one layer or the other, but not both.

### Spatial Join vs. Overlay

.left_half[
  ### Spatial Join

  Attribute data
  
  Attributes from one dataset are appended to those in another dataset based on a specified relative spatial relationship.

  it may or may not produce the same output as overlay

  retains the same features on the output
]

.right_half[
  ### Overlay
  
  Combines both spatial and attribute data from two layers to create a new layer.

  a new set of features based on the geometric intersection of the two input layers.
]

---

.right_half[
  <figure>
    <img src="imgs/vector/overlay_errors.png" width="100%">
  </figure>
]

### Overlay Errors

- **Sliver polygons**: A narrow gap formed when the shared boundary of two polygons do not meet exactly.

  - Using plugins like [Topology Checker](https://docs.qgis.org/3.40/en/docs/user_manual/plugins/core_plugins/plugins_topology_checker.html) can help identify and fix these issues.

- **Error propagation**: When inaccuracies are present in the original input and overlay layers and are carried through to an output layer.

## Distance

### Planar vs. Geodesic Distance

[Youtube: Why Don't Planes Fly in a Straight Line?](https://www.youtube.com/shorts/9gJkAT3Dkxw "is:video")

<br>

| Feature              | Planar Distance                     | Geodesic Distance                      |
|----------------------|--------------------------------------|----------------------------------------|
| **Earth Model**      | Flat plane                          | Curved surface (ellipsoid/sphere)     |
| **Accuracy**         | Lower over large areas              | High accuracy globally                |
| **Use Case**         | Local mapping, engineering          | Navigation, global analysis           |
| **Coordinate System**| Projected (e.g., UTM)               | Geographic (e.g., WGS84)              |
| **Computation**      | Simpler, faster                     | More complex, slower                  |

## Pattern Analysis

By mapping the spatial data set, we can have a general visual understanding of the distribution and identify any potential patterns or anomalies.

However, to further determine **whether these patterns are statistically significant**, we can apply various spatial analysis techniques.

Pattern analysis is the study of the spatial arrangements of point or polygon features in two-dimensional space.

Spatial statistics for describing the distribution pattern. 

---

.right_half[
  <figure>
    <img src="imgs/pattern_analysis/nearest_neighbour_analysis.jpg" class="zoomable" width="120%">
  </figure>
]

### Pattern Analysis Methods I

**Nearest neighbour analysis**

Uses the distance between each point and its closest neighbouring point in a layer to determine if the point pattern is random, regular, or clustered

<p>
  R = <span>d<sub>obs</sub></span> / <span>d<sub>exp</sub></span>
</p>

**Observed Mean Distance** (<span>d<sub>obs</sub></span>): Average distance between each point and its nearest neighbor.

**Expected Mean Distance** (<span>d<sub>exp</sub></span>): Based on random distribution. 


- **R < 1** → Points are closer than expected → **Clustered**

- **R ≈ 1** → Points are randomly distributed

- **R > 1** → Points are farther apart than expected → **Regular/Dispersed**

- **Z-score** and **p-value** for statistical significance.

### Pattern Analysis Methods III

**Hot Spot Analysis**

Hot spot analysis is a standard tool for mapping and analysing crime locations and public health data.

**G-Statistic**

A spatial statistic that measures the clustering of high and low values in a data set.

Output is usually a **z-score** and **p-value** for each feature:

| z-score | | Interpretation |
|---------|-|---------------|
| > +1.96 |: | Hot spot at 95% confidence |
| < –1.96 |: | Cold spot at 95% confidence |
| Near 0  |: | No significant clustering |

### Comparison between three pattern analysis methods

Nearest Neighbor Analysis = location only

Spatial Autocorrelation & Hot Spot Analysis = location + attribute values

--

- Global Moran’s I offers a global measure of spatial autocorrelation, indicating whether high or low values cluster together across the entire study area.

- Local indicators of spatial association (LISA) can be derived from the global Moran’s I, providing insights into specific areas of significant clustering.

- Hotspot analysis focuses on identifying statistically significant clusters of high or low values within a dataset, often using local measures like the Getis-Ord Gi* statistic.

<xL>LISA can identify both clusters and outliers, while hot spot analysis only identifies clusters of extremes. And they have different statistical basis.</xL>

---

### Pattern Analysis Methods

**GeoDa: Addition to QGIS**

Advanced spatial statistics such as spatial autocorrelation (Moran’s I), spatial regression, and hotspot analysis are not part of QGIS core. These require specialized plugins or external tools.

QGIS supports plugins like Spatial Analyzer and Spatial Analysis Toolbox, which provide advanced methods such as Moran’s I, GWR, clustering, and dispersion measures. 

These plugins often depend on Python libraries like PySAL, libpysal, and esda, which are not always pre-installed in QGIS. Installing them can be tricky because they require managing dependencies in QGIS’s Python environment

GeoDa is specialized for spatial econometrics and pattern analysis, making it a good complement when QGIS plugins are hard to configure.

Installing GeoDa: https://geodacenter.github.io/download
