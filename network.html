## Different Types of Distance

- **Euclidean Distance**

  The straight-line distance between two points in space.

- **Network-based Distance**

  Can be divided into:

  - **Shortest network distance**

    The smallest physical length along the network.

  - **Shortest network time**

    Considers realistic factors such as speed limits, traffic conditions, and other attributes to estimate travel time.

- **Manhattan Distance**

  The sum of absolute differences in coordinates (L1 norm). Common in grid-based systems and certain analytical contexts, though less used for real-world road routing.

### Euclidean Distance: Practice

<xL>Which MRT station has the best access to hawker centre?</xL>

--

1. **Distance-based solution:** How close is the nearest hawker centre?

2. **Buffer-based solution:** How many hawker centres are accessible within a certain radius?

<xL>Depending on how you approach the research question, you can even aggregate two solutions to have a more comprehensive evaluation.</xL>

### Composite Accessibility index

<div align="center">
  <figure>
      <img src="imgs/network/composite_accessibility_index.png" alt="cai_formula" width="30%">
  </figure>
</div>

two metrics per station:

1. sd(i): Nearest distance to a hawker centre (inverted so smaller distance → higher score).

2. sc(i): Hawker count within a fixed walking radius (e.g., 500 m; larger is better).

Assign weights:

1. w_d​ = weight for distance score (e.g., 0.5)

2. w_c​ = weight for count score (e.g., 0.5)

<xL>Based on the Composite Accessibility Index (CAI), which MRT stations have the lowest hawker centre accessibility, and how can this inform future hawker centre allocation?</xL>

### Network Data Cleaning

OSM data includes many attributes (tags such as name, surface, lanes, maxspeed, etc.), which can make the dataset quite bulky. Keeping only the relevant fields helps to:

1. Reduces file size

2. Speeds up processing

3. Makes attribute tables cleaner

Let's keep the four fields:

1. highway (road type)

2. length (geometry length)

3. maxspeed (if available, for time-based cost)

4. oneway (for directionality)

You should also keep the OSM ID (usually osm_id or id) when exporting or cleaning your road data.

Network analysis has relatively high requirements for data quality.

1. Not snapped at intersections or minor gaps between roads might cause fail or unrealistic paths.

2. Shortest network time requires more detailed informtion on fields like oneway, maxspeed, and length.

3. Disconnected subgraphs make some hubs **unreachable**
