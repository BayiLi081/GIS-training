## Different Types of Distance

- **Euclidean Distance**

  The <u>straight-line</u> distance between two points.

- **Network-based Distance**

  - **Shortest network distance**: The smallest physical length <u>along the network</u>.

  - **Shortest network time**: Considers <u>realistic factors</u> such as speed limits, traffic conditions, and other attributes to estimate travel time.

- **Manhattan Distance**

  The sum of absolute differences in coordinates. 
  
  Common in <u>grid-based systems and certain analytical contexts</u>, though less used for real-world road routing.

### Edge Effect

Distortions or inaccuracies that occur at the boundaries of your study area when performing spatial or network analyses.

**How to Manage Edge Effects?**

1. Buffer Your Study Area:

  Instead of cropping exactly to the Tampines boundary, <u>create a buffer</u> (in this case, we choose a buffer size of 1000 metre) around it.

2. Interpret Results Carefully:

  Be cautious when interpreting results near the boundary. Highlight in your report or map legend that edge effects may influence these areas.

3. Document Your Method:

  Always state in your methodology <u>how you handled the edge effect</u> (e.g., “A 1 km buffer was applied to the Tampines boundary to minimise edge effects in the analysis”).

### Composite Accessibility index

two metrics per station:

### Network Data Cleaning

OSM data includes many attributes (tags such as name, surface, lanes, maxspeed, etc.), which can make the dataset quite bulky. Keeping only the relevant fields helps to:

1. Reduces file size

2. Speeds up processing

3. Makes attribute tables cleaner

.right_half[
  <figure>
    <img src="imgs/network/reduce_network_size.png" width="100%">
    <figcaption>A significant size reduction after reduce the unneccesary fields.</figcaption>
  </figure>
]

Let's keep the four fields:

1. highway (road type)

2. oneway (for directionality)

3. maxspeed (if available, for time-based cost)

4. lanes (capacity?)

You should also keep the OSM ID (usually osm_id) when exporting or cleaning your road data.

## Topological Measurements

### Definition

Topological measurements are **quantitative metrics** used to describe the structure, connectivity, and properties of a network (such as a road network, social network, or utility grid) based solely on how nodes (points) and edges (connections) are arranged—regardless of their physical distances or geographic positions.

These measurements help us understand:

1. How well connected the network is

2. Which nodes or links are most important

3. The efficiency and robustness of the network

---

## Main Topological Measurements of a Network

### Density (Global)

- Definition: The ratio of actual connections to all possible connections in the network.

- Interpretation: Higher density means a more interconnected network.

<div align="center">
  <figure>
      <img src="imgs/network/network_density_calculation.png" width="50%">
      <figsubcaption>Source: https://www.numberanalytics.com/blog/mastering-network-density-in-social-network-analysis</figsubcaption>
</div>

| Density Range | Interpretation                              |
|---------------|---------------------------------------------|
| 0 - 0.3       | Low density, sparse |
| 0.3 - 0.6     | Moderate density, relatively connected |
| 0.6 - 1     | High density, highly connected |

---

## Main Topological Measurements of a Network

.right_half[
  <figure>
    <img src="imgs/network/beta_index.webp" width="100%">
    <figcaption>Beta Index in Graph.</figcaption>
    <figsubcaption>Source: https://transportgeography.org/contents/methods/graph-theory-measures-indices/beta-index-graph/</figsubcaption>
  </figure>
]

### Connectivity (Beta Index, Global)

- Definition: It expresses the average number of links (edges) per node (vertex) in a network.

- Interpretation: Indicates the average number of links per node. Values above 1 suggest a more connected network.

<div align="center">
  <figure>
      <img src="imgs/network/beta_index_formula.png" width="40%">
</div>

---

## Main Topological Measurements of a Network

### Average Path Length (Global)

- Definition: The mean lengths between the shortest paths of all pairs of vertices in the network.

- Interpretation: Indicates the overall efficiency of movement in the network.

<div align="center">
  <figure>
      <img src="imgs/network/avg_path_len.png" width="70%">
      <figsubcaption>Source: https://rpubs.com/odenipinedo/network-analysis-in-R</figsubcaption>
</div>

---

## Main Topological Measurements of a Network

### Node Degree (Local)

- Definition: It quantifies the number of direct connections, or edges, a node (vertex) has within a graph or network. It is the number of edges attached to a node.

- Interpretation: High-degree nodes are major junctions or hubs; low-degree nodes are dead-ends or simple intersections.

<div align="center">
  <figure>
      <img src="imgs/network/node_degree.png" width="90%">
</div>

## Main Topological Measurements of a Network

### Closeness Centrality (Local)

- Definition: The inverse of the sum of the shortest path distances from a node to all other nodes.

- Interpretation: Nodes with high closeness are centrally located and can reach all others quickly.

<div align="center">
  <figure>
      <img src="imgs/network/closeness_centrality_eq.png" width="50%">
  </figure>
</div>


---

## Main Topological Measurements of a Network

### Betweenness Centrality (Local)

- Definition: The number of shortest paths that pass through a node or edge.

- Interpretation: Nodes/edges with high betweenness are critical for movement and act as “bridges” or bottlenecks.

<div align="center">
  <figure>
      <img src="imgs/network/betweeness_centrality.png" width="55%">
      <figsubcaption>Source: https://www.jsums.edu/nmeghanathan/files/2015/08/CSC641-Fall2015-Module-2-Centrality-Measures.pdf</figsubcaption>
  </figure>
</div>

---

| **Measure**                   | **What It Describes**                                                            | **What It Tells You**                                                                 |
| ----------------------------- | -------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------- |
| **Density**                   | How full the network is compared with the maximum number of links it could have. | Shows **how connected the network is**. A dense network has many alternative routes.      |
| === | ===  | === |
| **Connectivity (Beta Index)** | The ratio of edges to nodes. | Indicates general network connectedness. Higher values show **more links for each node**. |
| === | ===  | === |
| **Average Path Length**       | The average number of steps needed to travel between all pairs of nodes.         | Reflects network efficiency. Lower values mean **shorter, more direct routes**.           |
| === | ===  | === |
| **Node Degree**               | The number of edges linked to a node.                                            | Highlights local importance. High-degree nodes act as **local hubs**.                     |
| === | ===  | === |
| **Closeness Centrality**      | How close a node is to all other nodes.                                          | Measures **accessibility**. High values mean a node can reach others with few steps.      |
| === | ===  | === |
| **Betweenness Centrality**    | How often a node lies on shortest paths between other nodes.                    | Shows control over flow. High-betweenness nodes act as **bridges or bottlenecks**.        |

---

| Measure | Example Research Question |
| ----------------------------- | -------------------------------------------------------------------------------- |
| **Density**                   | How does street-network density vary across neighbourhoods, and how does this variation relate to differences in walking rates? |
| === | ===  |
| **Connectivity (Beta Index)** | How does the beta index of local street networks influence route choice for short urban trips? |
| === | ===  |
| **Average Path Length**       | How does the average path length of a city’s street network affect travel times between key public facilities?         |
| === | ===  |
| **Node Degree**               | How do high-degree junctions shape traffic flow and local congestion patterns in dense urban areas? |
| === | ===  |
| **Closeness Centrality**      | How does the closeness centrality of street junctions relate to access to shops, parks, and public transport stops? |
| === | ===  |
| **Betweenness Centrality**    | How do nodes with high betweenness centrality contribute to bottlenecks and vulnerability in the urban street network? |

### Network Topological Measuring Tools in QGIS

There are multiple tools provided by GRASS built into QGIS

| **Tool**              | **Description**                                                             |
|-----------------------|-------------------------------------------------------------------------------|
| `d.path`              | Finds shortest path for selected starting and ending node.                   |
| `v.net.alloc`         | Allocates subnets for nearest centres.                                       |
| `v.net.centrality`    | Computes degree, centrality, betweenness, closeness and eigenvector metrics. |
| `v.net.connectivity`  | Computes vertex connectivity between two sets of nodes in the network.       |

**You may refer https://grass.osgeo.org/grass-stable/manuals/topic_network.html for more detailed instructions for more tools**

### Further Cleaning: Understand OSM Roads

OSM splits a road into separate “ways” (line features) <u>whenever any attribute (tag) changes</u>. 

For example, if the road surface changes from asphalt to gravel, or the speed limit, number of lanes, lighting, or even the name changes, a new segment is created at that point.

### v.clean: Toolset for cleaning topology

v.clean is a GRASS GIS tool designed to clean and correct vector data, especially line such as road networks.

It helps ensure your data is topologically correct—meaning <u>all lines connect properly, there are no unwanted overlaps, gaps, or duplicates, and the geometry is suitable</u> for network analysis.

### v.clean: Toolset for cleaning topology

You can apply one or more of these common cleaning operations in sequence:

| Function | What it does                       | Typical Use Case                 |
| -------- | ---------------------------------- | -------------------------------- |
| break    | Splits lines at intersections      | Ensuring all roads connect       |
| snap     | Connects nearly-touching endpoints | Fixing small misalignments       |
| rmdupl   | Removes duplicate lines            | Cleaning up overlapping features |
| rmdangle | Removes small, unconnected stubs   | Removing accidental “tails”      |
| prune    | Removes small bends/spikes         | Smoothing geometry               |

Cleaning OSM roads is not always mandatory. It depends on your research questions and the intended analysis. 

The choice of cleaning functions should be tailored to your specific needs.

### Workflow to get a clean typological network

1. Dissolve all lines into a single multipart geometry
(Vector → Geoprocessing Tools → Dissolve, no dissolve field)

2. v.clean → break
(Splits at intersections to produce true nodes)

3. Continue with v.net.* tools.

<xL>It will lose the attributes. If you wish to maintain the attributes, it requires extra cleanning process.</xL>

Use `v.to.points` to generate nodes.
