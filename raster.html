name: raster-model

## The Raster Data Model

A **raster** represents space as a regular grid of cells (pixels). Each cell stores a numeric value that describes a property at that location.

<div align="center">
  <figure>
    <img src="imgs/raster/a_simple_raster.png" width="55%">
    <figcaption>A simple raster grid: each cell holds one value.</figcaption>
  </figure>
</div>

- Every cell has the same width and height — the **resolution**.
- The grid has a defined **extent** (bounding coordinates) and a **Coordinate Reference System (CRS)**.
- Rasters may contain one band (single-band) or many bands (multi-band).

Raster is the natural format for **continuous phenomena** (elevation, temperature, air quality) and **imagery** (satellite, aerial, drone).

---

## When to Use Raster

Raster is most appropriate when the phenomenon is:
- **Continuous** — varies smoothly across space
- **Gridded** — measured or modelled on a regular lattice
- **Image-based** — captured by a sensor as pixels
- **Repeated** — monitored over time at the same locations

| Domain | Example Raster Data |
|---|---|
| Elevation &amp; Terrain | Digital Elevation Models (DEM), slope, aspect |
| Climate &amp; Weather | Temperature distribution, rainfall surfaces |
| Remote Sensing Imagery | Satellite images (multispectral), aerial photos |
| Environmental Pollution | Air quality index, noise pollution gradients |
| Hydrology | Flood depth maps, groundwater potential zones |
| Agriculture | Crop health monitoring, biomass estimation |
| Hazard &amp; Risk | Landslide susceptibility, wildfire risk zones |

name: raster-vs-vector

## Vector and Raster Data Models

Spatial data is primarily represented using two major models:

.left_half[
**Vector data** represents discrete features as geometries:

- **Points**, **lines**, and **polygons**
- e.g. bus stops, roads, buildings, planning areas

**Raster data** represents space as a grid of cells:

- Each cell (pixel) stores a value
- e.g. satellite imagery, elevation, land surface temperature
]

.right_half[
<div align="center">
  <figure>
    <img src="imgs/vector_n_raster_presentation.png" width="45%">
    <figcaption>Raster and vector representation of real world entities.</figcaption>
    <figsubcaption>Source: https://gis.stackexchange.com/questions/7077/what-are-raster-and-vector-data-in-gis-and-when-to-use</figsubcaption>
  </figure>
</div>
]

.clear[]

---

## Vector vs. Raster: The Key Difference

- **Vector** describes *where things are* using coordinates — best for objects with **clear boundaries** (e.g. parcels, roads).

- **Raster** describes *what value each location has* — best for **continuous phenomena** that vary across space (e.g. temperature, elevation).

The choice of data model affects how data is stored, visualised, and analysed. Both are covered in detail in this course: [Week 6 (vector)](vector.html) and [Week 8 (raster)](#).

---

## Comparison: Vector and Raster Data Model

.center-table[
| | Raster | Vector |
|---|---|---|
| **Advantages** | Simple data structure | More compact |
| | Efficient in overlay operations | Efficient in topology-based operations |
| | Better represents high spatial variability | Better map visualisation |
| | Widely used in remote sensing and image data | |
| **Disadvantages** | Less compact | More complex |
| | Underrepresented topological relationships | Inefficient for high spatial variability |
| | Disadvantages in visualisation | Unable to handle image data |
]

**Rule of thumb:**
- Use **vector** for objects with clear boundaries and relationships.
- Use **raster** for continuous data or when performing spatial modelling that requires grid-based calculations.

## Raster Data Types

### Continuous vs. Discrete Rasters

**Continuous raster:** Cell values vary continuously to form a surface — e.g. elevation, temperature, air quality.

<div align="center">
  <figure>
    <img src="imgs/raster/example_dem.jpg" alt="Singapore DEM" width="50%">
    <figcaption>Digital Elevation Model (DEM) — a continuous raster.</figcaption>
    <figsubcaption>Source: AI Singapore, https://aisingapore.org/tech-offers/improving-satellite-digital-elevation-models-dem-using-ai/</figsubcaption>
  </figure>
</div>

---

## Raster Data Types

### Continuous vs. Discrete Rasters

**Discrete (categorical) raster:** Cells represent phenomena with clear boundaries and categorical attributes — e.g. land cover classes, zoning.

<div align="center">
  <figure>
    <img src="imgs/raster/corine_landcover_raster.jpg" width="80%">
    <figcaption>CORINE Land Cover — a discrete (categorical) raster.</figcaption>
  </figure>
</div>

---

## Raster Data Types

### Single-band vs. Multi-band Rasters

**Single-band raster:** Each cell holds one value — e.g. DEM, slope, a single spectral band.

**Multi-band raster:** Each cell holds multiple values stacked as bands — e.g. RGB imagery (3 bands), Landsat (7–11 bands), hyperspectral sensors (hundreds of bands).

<div align="center">
  <figure>
    <img src="imgs/raster/worldpop_multibands.jpg" width="80%">
    <figcaption>Multi-band raster opened in QGIS showing individual bands.</figcaption>
  </figure>
</div>

---

## Raster Data Interpretation

When inspecting a raster, always check:

| Property | Question |
|---|---|
| **CRS** | Is it geographic (lat–lon) or projected? |
| **Resolution** | What real-world distance does one cell represent? |
| **Extent** | What geographic area does it cover? |
| **Bands** | How many bands and what does each represent? |
| **Data type** | Are values integer, float? What is the nodata value? |
| **Statistics** | What are the min, max, mean, and distribution? |

<div align="center">
  <figure>
    <img src="imgs/raster/example_image_inQGIS_checkvalue.jpg" width="70%">
    <figcaption>Inspecting raster properties and pixel values in QGIS.</figcaption>
  </figure>
</div>

---

## Raster Data Formats

Common raster file formats you will encounter:

- **GeoTIFF** (`.tif`, `.tiff`): The standard — embeds CRS, extent, and metadata. Widest software support.
- **GeoPackage** (`.gpkg`): Can store both raster and vector tiles in a single SQLite database.
- **IMG** (`.img`): ERDAS Imagine format, common in remote sensing workflows.
- **JPEG 2000** (`.jp2`): Compressed format used by Sentinel-2 products.
- **NetCDF** (`.nc`): Common for climate and oceanographic raster data.
- **HDF** (`.hdf`, `.h5`): Hierarchical format used by MODIS and other NASA products.

Different formats are not just technical details — they affect compression, metadata handling, and software compatibility.

## Satellite Imagery as Raster Data

Satellite imagery is a multi-band raster captured by sensors on orbiting platforms.

<div align="center">
  <figure>
    <img src="imgs/raster/landsat8.png" width="75%">
    <figcaption>Landsat 8 satellite and its operational land imager.</figcaption>
  </figure>
</div>

Major open-access satellite programmes:

| Programme | Agency | Bands | Resolution | Revisit |
|---|---|---|---|---|
| **Landsat 8/9** | NASA/USGS | 11 bands | 15–100 m | 16 days |
| **Sentinel-2** | ESA/Copernicus | 13 bands | 10–60 m | 5 days |
| **MODIS** | NASA | 36 bands | 250–1000 m | 1–2 days |
| **SRTM / ASTER** | NASA | DEM | 30 m | static |

---

## Understanding Satellite Image Bands

Each band captures a specific range of the electromagnetic spectrum:

<div align="center">
  <figure>
    <img src="imgs/raster/5019-Landsat-timeline-L7_decomissioned_2025.png" width="90%">
    <figcaption>Landsat mission timeline and band evolution.</figcaption>
  </figure>
</div>

| Band Type | Wavelength | What It Reveals |
|---|---|---|
| **Coastal aerosol** | 0.43–0.45 µm | Shallow water, dust, smoke |
| **Blue** | 0.45–0.51 µm | Water penetration, atmosphere |
| **Green** | 0.53–0.59 µm | Vegetation vigour |
| **Red** | 0.64–0.67 µm | Chlorophyll absorption, vegetation |
| **NIR** (Near Infrared) | 0.85–0.88 µm | Vegetation health, biomass |
| **SWIR** (Shortwave IR) | 1.57–2.29 µm | Moisture, geology, built-up |
| **Thermal** | 10.60–12.51 µm | Surface temperature |

---

## True Colour vs. False Colour Composites

By assigning different bands to the RGB display channels, you reveal different information:

<div align="center">
  <figure>
    <img src="imgs/raster/example_image_inQGIS_truecolourvsfalsecolour.jpg" width="80%">
    <figcaption>Left: True colour (Red, Green, Blue). Right: False colour (NIR, Red, Green) highlighting vegetation in red.</figcaption>
  </figure>
</div>

- **True colour** (R, G, B): what the human eye would see — good for visual interpretation.
- **False colour infrared** (NIR, R, G): vegetation appears bright red — widely used in agriculture and forestry.
- **Urban false colour** (SWIR, NIR, Red): built-up areas are distinct from vegetation — useful for urban studies.

## Raster Overlay and Map Algebra

Combine multiple raster layers cell-by-cell using arithmetic, Boolean, or conditional expressions.

<div align="center">
  <figure>
    <img src="imgs/raster/raster_overlay.png" width="55%">
    <figcaption>Raster overlay: combining multiple layers through cell-by-cell operations.</figcaption>
  </figure>
</div>

**Map algebra** expressions:
- `"slope > 15"` — extract steep areas
- `"landcover == 2"` — isolate a single land cover class
- `"NDVI * 100"` — rescale values
- `"elevation > 100 AND slope < 5"` — multi-criteria selection

---

## Reclassification

Assign new values to ranges of cell values — simplify a continuous raster into meaningful categories.

<div align="center">
  <figure>
    <img src="imgs/raster/reclassify.png" width="65%">
    <figcaption>Reclassification: grouping cell values into discrete classes.</figcaption>
  </figure>
</div>

Common use cases:
- Reclassify elevation into low, medium, high terrain.
- Reclassify a vegetation index into sparse, moderate, dense vegetation.
- Reclassify slope into buildable and non-buildable categories.
- Simplify a land cover classification by merging similar classes.

---

## Warping and Resampling

Rasters from different sources often have different CRS, resolution, or alignment.

<div align="center">
  <figure>
    <img src="imgs/raster/warp_project_raster.jpg" width="55%">
    <figcaption>Reprojecting (warping) a raster to a target CRS.</figcaption>
  </figure>
</div>

**Resampling methods:**
- **Nearest neighbour**: preserves original values — best for categorical rasters.
- **Bilinear / Cubic**: interpolates new values — best for continuous rasters.
- **Majority**: takes the most common value — useful for aggregating categorical data.

name: indices

## Remote Sensing Indices

A **spectral index** is a mathematical combination of two or more spectral bands that highlights a specific surface property. Indices reduce multi-band data to a single interpretable value per pixel.

<div align="center">
  <figure>
    <img src="imgs/raster/ndvi_eq.jpg" width="55%">
    <figcaption>The NDVI formula: (NIR − Red) / (NIR + Red).</figcaption>
  </figure>
</div>

---

## Major Remote Sensing Indices

| Index | Formula Bands | What It Identifies | Urban Use Cases |
|---|---|---|---|
| **NDVI** | (NIR−Red) / (NIR+Red) | Vegetation health and density | Urban greenery, park quality, heat mitigation |
| **NDWI** | (Green−NIR) / (Green+NIR) *(McFeeters)* | Water bodies | Flood mapping, water resource management |
| **NDWI** | (NIR−SWIR) / (NIR+SWIR) *(Gao)* | Vegetation water content | Crop water stress, drought monitoring |
| **NDBI** | (SWIR−NIR) / (SWIR+NIR) | Built-up / urban areas | Urban expansion, land-use classification |
| **NDMI** | (NIR−SWIR) / (NIR+SWIR) | Vegetation moisture | Drought monitoring, fire risk assessment |
| **EVI** | 2.5×(NIR−Red)/(NIR+6×Red−7.5×Blue+1) | Vegetation (corrected for atmosphere/soil) | Dense vegetation monitoring, high-biomass areas |

name: cv-raster

## Images as Raster Data for Computer Vision

An image is a raster: a grid of pixels with values. Computer vision transforms these pixel values into semantic information.

Each pixel may store:
- one value in **grayscale** imagery
- three values in **RGB** images
- many values in **multispectral** imagery
- a **class label** after segmentation or classification

---

## From Image to Urban Indicator

| Step | Input | Output | Urban Interpretation |
|---|---|---|---|
| Capture | street-view or remote image | geotagged image | observed location |
| Preprocess | raw image | aligned, resized image | comparable samples |
| Inference | image + model | classes, objects, masks | scene composition |
| Measurement | model output | counts, area share, score | quantitative indicator |
| GIS analysis | indicator + location | map, statistics, model | spatial pattern |

The critical step is maintaining the **spatial reference** attached to every image and every derived measurement.

---

## Common Computer Vision Tasks on Raster Images

| Task | Question | Output | Urban Example |
|---|---|---|---|
| Image classification | What is in this image? | one or more labels | residential vs. commercial street scene |
| Object detection | Where are specific objects? | bounding boxes | vehicles, pedestrians, traffic signs |
| Semantic segmentation | What class is each pixel? | pixel-level class map | road, sky, building, tree, sidewalk |

**Semantic segmentation** is especially useful when the quantity of interest is a visible proportion — such as greenery, sky openness, or road space allocation.

---

## Semantic Segmentation

Semantic segmentation assigns a class label to every pixel.

<div align="center">
  <figure>
    <img src="imgs/applygis/gvi_segmentation_model.webp" alt="Street view semantic segmentation workflow" class="zoomable" width="78%">
    <figcaption>Street view image sampling and semantic segmentation.</figcaption>
    <figsubcaption>Source: 10.1038/s41598-024-81451-6</figsubcaption>
  </figure>
</div>

The output can be measured directly: percentage of vegetation pixels, sky pixels, building facade pixels, and other visible classes.

---

## What the Segmented Image Gives Us

| Class | Possible Measurement | Urban Meaning |
|---|---|---|
| Vegetation | share of pixels | eye-level greenery, shade potential |
| Sky | share of pixels | openness, enclosure, street canyon effect |
| Road | share of pixels | vehicle-oriented public realm |
| Sidewalk | share of pixels | pedestrian space |
| Building | share of pixels | frontage, density, enclosure |

The model output is not the final answer — it is an intermediate data layer requiring spatial aggregation and interpretation.

---

## Green View Index (GVI)

Green View Index (GVI) estimates the visible proportion of greenery from a street-level viewpoint.

```
GVI = green pixels / all valid pixels
```

**GVI vs. NDVI:**
- **NDVI** measures vegetation health from spectral bands, usually from above (satellite / aerial).
- **GVI** measures greenery as seen by pedestrians at eye level (street-level imagery).

These two indicators answer related but **not identical** urban questions. NDVI tells you about canopy density and vigour; GVI tells you about the pedestrian experience of greenness.

---

## Spatial Aggregation of Image-Derived Indicators

After extracting image-level indicators, aggregate them to GIS analysis units:

| Image-Level Value | Aggregation Unit | Output |
|---|---|---|
| GVI per panorama | road segment | average visible greenery |
| sidewalk pixels | street block | pedestrian-space score |
| building pixels | planning area | enclosure indicator |
| object counts | intersection | traffic activity proxy |
| scene labels | neighbourhood | dominant street character |

Aggregation makes the output easier to map, but it can also hide local variation.

- **Petabyte catalogue**: Landsat, Sentinel, MODIS, and hundreds more

- **Free for research, education, and non-profit use**

## Cartographic Symbology for Raster Data

Choosing symbology for raster data is part of cartographic design:

- **Single-band continuous** → graduated colour ramp (e.g. elevation, temperature)
- **Single-band discrete** → palette with distinct colours per class (e.g. land cover)
- **Multi-band imagery** → band combination selection (true colour, false colour)
- **Hillshade** → overlay on top of other layers for terrain context

## Tutorial Workflow for Raster Analysis

A practical raster analysis workflow:

1. **Inspect** — check the raster's extent, CRS, resolution, and band structure.
2. **Symbolise** — choose suitable symbology to understand the values visually.
3. **Clip or mask** — extract the raster to your study area.
4. **Transform** — run a reclassification, index calculation, or map algebra operation.
5. **Summarise** — use zonal statistics or visual comparison to interpret results.
6. **Document** — record assumptions about resolution, CRS, thresholds, and data sources.

## Learning Objectives Recap

By the end of this module, students should be able to:

1. explain how raster data represents space as a grid of cells
2. distinguish between common raster types (continuous, categorical, single-band, multi-band) and their sources
3. interpret raster bands, cell values, extent, and resolution
4. describe core raster operations used in GIS and remote sensing (clip, mask, reclassify, overlay, map algebra, zonal statistics)
5. compute and interpret key remote sensing indices (NDVI, NDWI, NDBI, NDMI, EVI)
6. apply raster analysis concepts to urban questions such as vegetation, temperature, urban growth, and street-level perception
7. understand how images serve as raster data for computer vision tasks and urban indicator derivation

## Key Takeaways

- **Raster data** represents space as a grid of cells — ideal for continuous surfaces and imagery.
- **Resolution, extent, band structure, and CRS** strongly affect raster interpretation and must be checked before analysis.
- **Core operations** include clipping, masking, reclassification, overlay, map algebra, warping/resampling, and zonal statistics.
- **Remote sensing indices** such as NDVI, NDWI, NDBI, and LST transform multi-band imagery into interpretable urban variables.
- **Nighttime light data** provides consistent global coverage for tracking urbanisation and economic activity over time.
- **Images are raster data** — computer vision (segmentation, classification) turns pixel values into urban indicators like GVI.
- **Raster and vector are complementary** — conversion between them, zonal statistics, and mask operations bridge the two models.
- **Tooling**: QGIS for interactive work; Rasterio/GDAL for Python scripting; Google Earth Engine for planetary-scale cloud analysis.
- Raster analysis becomes most powerful when technical operations are connected to **environmental and urban questions**.
