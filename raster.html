## Raster Data
name: week8-focus
- [Raster Data Model](#raster-general)
## Week 8 Focus

This lecture introduces raster data as a major model for representing continuous spatial phenomena and remote sensing imagery.

- understand when raster is more suitable than vector
- distinguish between continuous, categorical, single-band, and multi-band rasters
- learn the logic of clipping, reclassification, overlay, and zonal statistics
- connect raster analysis to urban environmental and remote sensing questions

---

## Learning Objectives

By the end of this session, students should be able to:

1. explain how raster data represents space as a grid of cells
2. distinguish between common raster types and sources
3. interpret raster bands, cell values, extent, and resolution
4. describe core raster operations used in GIS and remote sensing
5. apply raster analysis concepts to urban questions such as vegetation, temperature, and urban growth

---

## Lecture Outline

1. Raster data model and raster types
2. Bands, resolution, and interpretation
3. Core raster operations in GIS
4. Remote sensing indices and urban applications
5. Tutorial workflow in QGIS and Python

## Single-band Raster

### Discrete (Categorical) Raster

A raster that typically represents phenomena that have clear boundaries with attributes that are descriptions, classes, or categories.

<div align="center">
  <figure>
      <img src="imgs/raster/corine_landcover_raster.jpg" alt="corine_landcover_raster" width="30%">
      <figcaption>Example raster: Corine Land Cover 2018 LAEA-raster 100m.</figcaption>
      <figsubcaption>Source: https://land.copernicus.eu/en/map-viewer?product=130299ac96e54c30a12edd575eff80f7/</figsubcaption>
  </figure>
</div>

*Reference: https://support.esri.com/en-us/gis-dictionary/discrete-raster*

---

<xL>Why does Singapore use the vector data model for land use, while some global land use/land cover datasets use the raster data model?</xL>

--

| **Aspect**            | **Vector Representation**                                  | **Raster Representation**                                  |
|------------------------|------------------------------------------------------------|-----------------------------------------------------------|
| **Best for**           | Precise boundaries (parcels, zones, administrative areas) | Continuous coverage or classified imagery                |
| **Typical Source**     | Cadastral maps, planning datasets                        | Remote sensing classification, satellite imagery         |
| **Attribute Handling** | Rich attribute tables for each feature                   | Limited attributes (usually one value per cell)          |
| **Scale**              | Detailed, small-scale urban planning                     | Large-scale regional or global analysis                  |
| **Advantages**         | Accurate geometry, supports topology                     | Efficient for raster-based analysis and modeling         |
| **Disadvantages**      | Complex for large areas, harder for pixel-based analysis | Less precise boundaries, large file size for high resolution |
| **Common Uses**        | Zoning, parcel management, infrastructure planning        | Land cover classification, change detection, suitability analysis |

### False Colour

**True colour:** A composite image where the Red, Green, and Blue bands correspond to the visible light spectrum as perceived by the human eye.

**False colour:** A composite image where the Red, Green, and Blue bands are assigned to different wavelengths, such as near-infrared, red, and green, to highlight specific features.

## Spatial Analysis of Raster Data

- Like the geoprocessing tools available for use on vector datasets, raster data can undergo similar spatial operations.

- The actual computation of these operations is significantly different from their vector counterparts, but the concept is similar.

- A raster operation may involve two or more rasters

---

### Data analysis environment

- Specifying the area extent and output cell size

- **Union options**: encompasses all input rasters

- **Intersect option** uses an area extent that is common to all input rasters

- An **analysis mask**, either a feature layer or a raster, can also determine the area extent for analysis

### Clipping a Raster

- A raster dataset can also be clipped similar to a vector dataset.

- Here, the input raster is overlain by a vector polygon clip layer.

- The raster clip process results in a single raster that is identical to the input raster but shares the extent of the polygon clip layer.

### Reclassifying

- Reclassification is the process of assigning a new class or range value to all pixels in the dataset based on their original values

### Raster Overlays

- Raster overlays are relatively simple compared to vector overlays and require much less computational power

- Mathematical raster overlay (Map algebra): Pixel or grid cell values in each map are combined using mathematical operators to produce a new value in the composite map.

### Map algebra

A set of primitive operations in a GIS allowing two or more raster layers of similar dimensions to produce a new raster layer using algebraic operations.

Can be run from a raster calculator or by scripting.

Example: measuring slopes from and elevation model

```python
slope_d = Slope(“emidalat”, “degree”)

“slope_d”, a slope raster measured in degree
“emidalat” an elevation raster

ExtractByAttributes(“slope_d”, “Value < 20”)

ExtractByAttributes(Slope(“emidalat”, “DEGREE”), “Value < 20”)
```

## Why Raster Analysis Matters in Urban Studies

Raster workflows are especially useful when the question concerns:

- land surface temperature
- vegetation condition
- elevation and slope
- broad environmental exposure surfaces
- repeated satellite observations through time

Raster analysis is central whenever the phenomenon is measured continuously or captured through imagery.

---

### Landsat series

The Landsat series is a long-running program of Earth observation satellites jointly managed by NASA and the U.S. Geological Survey (USGS). It’s one of the most important sources of continuous, high-resolution imagery of the Earth’s land surface, used for environmental monitoring, resource management, and scientific research.

<div align="center">
  <figure>
    <img src="imgs/raster/5019-Landsat-timeline-L7_decomissioned_2025.png" width="60%">
    <figcaption>The Landsat series timeline.</figcaption>
    <figsubcaption>Source: https://www.usgs.gov/media/images/landsat-missions-timeline</figsubcaption>
  </figure>
</div>

### Landsat series

In **Landsat 8-9 Operational Land Imager (OLI) and Thermal Infrared Sensor (TIRS**):

| Bands                                | Wavelength (micrometers) | Resolution (meters) |
| ------------------------------------ | ------------------------ | ------------------- |
| Band 1 - Coastal aerosol             | 0.43-0.45                | 30                  |
| Band 2 - Blue                        | 0.45-0.51                | 30                  |
| Band 3 - Green                       | 0.53-0.59                | 30                  |
| Band 4 - **Red**                     | 0.64-0.67                | 30                  |
| Band 5 - **Near Infrared (NIR)**     | 0.85-0.88                | 30                  |
| Band 6 - Shortwave Infrared (SWIR) 1 | 1.57-1.65                | 30                  |
| Band 7 - Shortwave Infrared (SWIR) 2 | 2.11-2.29                | 30                  |
| Band 8 - Panchromatic                | 0.50-0.68                | 15                  |
| Band 9 - Cirrus                      | 1.36-1.38                | 30                  |
| Band 10 - Thermal Infrared (TIRS) 1  | 10.6-11.19               | 100                 |
| Band 11 - Thermal Infrared (TIRS) 2  | 11.50-12.51              | 100                 |

## Application of Raster Analysis

#### Calculate NDVI (Normalized Difference Vegetation Index)

NDVI uses the Near Infrared (NIR) and Red bands from sensors like Landsat 8’s OLI because vegetation strongly reflects **NIR light** and absorbs **red light**. 

<div align="center">
  <figure>
      <img src="imgs/raster/landsat8.png" alt="scale_raster_analysis" class="zoomable" width="80%">
  </figure>
</div>

.right_half[

    <img src="imgs/raster/ndvi_comparison.jpg" alt="clip_raster_vector" class="zoomable" width="100%">
  </figure>
]

### Application of raster analysis

#### Calculate NVDI

NDVI is used to quantify vegetation greenness and is useful in understanding vegetation density and assessing changes in plant health.

<figure>
  <img src="imgs/raster/ndvi_eq.jpg" width="25%">
</figure>

In Landsat 4-7, NDVI = (Band 4 – Band 3) / (Band 4 + Band 3).

In Landsat 8-9, NDVI = (Band 5 – Band 4) / (Band 5 + Band 4).

Healthy vegetation (chlorophyll) reflects more near-infrared (NIR) and green light compared to other wavelengths. But it absorbs more red and blue light.

*Urban Vegetation Classes and NDVI value (Source: [Urban vegetation classification with NDVI threshold value method with very high resolution (VHR) Pleiades imagery](https://isprs-archives.copernicus.org/articles/XLII-4-W16/237/2019/))*

---

.right_half[
  <figure>
    <img src="imgs/raster/ndvi_results.png" alt="clip_raster_vector"class="zoomable"  width="100%">
  </figure>
]

### Application of raster analysis

#### Calculate NVDI

By comparing these two, NDVI measures vegetation health:

- Values close to +1 → dense, healthy vegetation.

- Values near 0 → bare soil or sparse vegetation.

- Negative values → water or non-vegetated surfaces.

---

.right_half[
  <figure>
    <img src="imgs/raster/ndvi_reclassification.png" alt="clip_raster_vector"class="zoomable"  width="100%">
  </figure>
]

### Application of raster analysis

#### Calculate NVDI

Reclassification turns NDVI from a continuous index into actionable categories for interpretation, mapping, and modeling.

| **Class**            | **NDVI Range**      | **Interpretation**            |
|----------------------|----------------------|--------------------------------|
| **1**         | < 0.0              | Water / Non-vegetated         |
| **2**         | 0.0 – 0.2          | Bare soil / Built-up areas    |
| **3**         | 0.2 – 0.4          | Sparse vegetation             |
| **4**         | 0.4 – 0.6          | Moderate vegetation           |
| **5**         | > 0.6              | Dense, healthy vegetation     |

## Urban Environmental Example: Land Surface Temperature

Land Surface Temperature (LST) is a strong example of why raster matters in urban studies.

- it varies continuously across space
- it can be derived from thermal remote sensing
- it supports questions about urban heat, vegetation, and built form

Raster analysis allows these values to be clipped, reclassified, summarised by zones, and compared through time.

### Other Remote Sensing indices

| **Name** | **Bands** | **What it Identifies** | **Use Cases** |
|-----------|------------|------------------------|----------------|
| **NDVI** (Normalized Difference Vegetation Index) | NIR and Red | Vegetation Health | Agriculture, Forestry |
| **NDWI** (Normalized Difference Water Index) | Green and NIR *(McFeeters, 1996)* OR NIR and SWIR *(Gao, 1996)* | Water Bodies (Green-NIR) or Vegetation Water Content (NIR-SWIR) | Flood Mapping, Water Resource Management, Crop Water Stress |
| **NDMI** (Normalized Difference Moisture Index) | NIR and SWIR | Vegetation Moisture Content | Drought Monitoring, Irrigation Planning, Fire Risk Assessment |
| **NDBI** (Normalized Difference Built-up Index) | SWIR and NIR | Built-up or Urban Areas | Urban Expansion, Land-use Classification |
| **EVI** (Enhanced Vegetation Index) | NIR, Red, and Blue | Vegetation Density and Health (corrects atmospheric and soil effects) | Agriculture, Forestry, Dense Vegetation Monitoring |

### Nighttime Light Data

The **nighttime light (NTL)** data is a kind of remote sensing data to detect the lights from human settlement, gas flares and fires, which is derived from the Defense Meteorological Satellite Programs Operational Linescan System (DMSP/OLS).

NTL data is powerful because it provides consistent, global coverage and is often available at high temporal resolution, making it ideal for tracking changes over time.

It can be used for urbanization and growth monitoring, as a proxy for socioeconomic indicators, and for studying light pollution, among other applications.

## Tutorial Workflow

For week 8, a practical raster workflow is:

1. inspect raster extent, CRS, resolution, and band structure
2. choose suitable symbology to understand the values visually
3. clip or mask the raster to the study area
4. run a basic transformation such as reclassification or index calculation
5. summarise the result with zonal statistics or visual comparison
6. document the assumptions behind resolution, CRS, and thresholds

## Key Takeaways

- Raster data represents space as a grid of cells and is especially useful for continuous surfaces and imagery.
- Resolution, extent, band structure, and CRS strongly affect raster interpretation.
- Core raster operations include clipping, reclassification, overlay, map algebra, and zonal statistics.
- Remote sensing indices such as NDVI and datasets such as LST and nighttime lights are highly relevant to urban analysis.
- Raster analysis becomes most powerful when students connect technical operations to environmental and urban questions.
