## Raster Data Model

Raster represents geographic phenomena as a **continuous grid of cells with values**

--

Urban features such as buildings, parcels, roads, parks, and zones have **clearly defined boundaries**, making vector data more appropriate for representing these discrete elements. 

Conversely, raster data is better suited for modeling continuous surfaces.

--

<xL>Can you think some themes that are more suitable for the raster data model?</xL>

---

## Raster Data Model

These themes involve **continuous surfaces or grid-based measurements**, which raster handles better than vector:

<br>

| | Elevation and Terrain | | Climate and Weather | | Remote Sensing Imagery | | Soil and Geology |
|-|-----|-|-----|-|-----|-|-----|
|*| Digital Elevation Models (DEM) |*| Temperature distribution |*| Satellite images (multiband) |*| Soil moisture |
|*| Slope and aspect analysis |*| Rainfall and humidity surfaces |*| Vegetation indices (NDVI) |*| Mineral concentration |

<br>

| | Environmental Pollution | | Hydrology | | Agriculture | | Hazard and Risk Mapping |
|-|-----|-|-----|-|-----|-|-----|
|*| Air quality index |*| Flood depth maps |*| Crop health monitoring |*| Landslide susceptibility |
|*| Noise pollution gradients |*| Groundwater potential zones |*| Biomass estimation |*| Wildfire risk zones |

## Single-band Raster

A raster that typically represents phenomena that have clear boundaries with attributes that are descriptions, classes, or categories.

<xL>Why does Singapore use the vector data model for land use, while some global land use/land cover datasets use the raster data model?</xL>

<br>

--

| **Aspect**            | **Vector Representation**                                  | **Raster Representation**                                  |
|------------------------|------------------------------------------------------------|-----------------------------------------------------------|
| **Best for**           | Precise boundaries (parcels, zones, administrative areas) | Continuous coverage or classified imagery                |
| **Typical Source**     | Cadastral maps, planning datasets                        | Remote sensing classification, satellite imagery         |
| **Attribute Handling** | Rich attribute tables for each feature                   | Limited attributes (usually one value per cell)          |
| **Scale**              | Detailed, small-scale urban planning                     | Large-scale regional or global analysis                  |
| **Advantages**         | Accurate geometry, supports topology                     | Efficient for raster-based analysis and modeling         |
| **Disadvantages**      | Complex for large areas, harder for pixel-based analysis | Less precise boundaries, large file size for high resolution |
| **Common Uses**        | Zoning, parcel management, infrastructure planning        | Land cover classification, change detection, suitability analysis |

### False Colour

**True colour:** A composite image where the Red, Green, and Blue bands correspond to the visible light spectrum as perceived by the human eye.

**False colour:** A composite image where the Red, Green, and Blue bands are assigned to different wavelengths, such as near-infrared, red, and green, to highlight specific features.

<xL>Purpose: Highlighting specific features.</xL>

## Spatial Analysis of Raster Data

- Like the geoprocessing tools available for use on vector datasets, raster data can undergo similar spatial operations.

- The actual computation of these operations is significantly different from their vector counterparts, but the concept is similar.

- A raster operation may involve two or more rasters

---

## Data analysis environment

- Specifying the area extent and output cell size

- **Union options**: encompasses all input rasters

- **Intersect option** uses an area extent that is common to all input rasters

- An **analysis mask**, either a feature layer or a raster, can also determine the area extent for analysis

### Clipping a Raster

- A raster dataset can also be clipped similar to a vector dataset.

- Here, the input raster is overlain by a vector polygon clip layer.

- The raster clip process results in a single raster that is identical to the input raster but shares the extent of the polygon clip layer.

---

.right_half[
  <figure>
    <img src="imgs/raster/clip_raster_e1.png" alt="clip_raster_vector" width="90%">
  </figure>
]

### Clipping a Raster

Clipping a raster with a vector in GIS (including QGIS) works by using the geometry of the vector layer as a mask to extract only the portion of the raster that falls within the vector’s boundaries.

### Practice: Clipping a Raster

Drag the file: **data/SG_LST_L9_20250706_Filled.tif** into QGIS

LST refers to Land Surface Temperature. It is a measure of the radiative skin temperature of the Earth’s surface.

1. Right-click on the raster layer and select **Properties**.

2. Go to the **Symbology** tab.

3. Choose a suitable colour ramp to visualize the temperature values.

4. Click **OK** to apply the changes.
