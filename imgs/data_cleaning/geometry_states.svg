<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Missing, empty, invalid and valid are different</title><rect width="900" height="440" rx="18" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="42" font-size="28" fill="#173e55">Missing, empty, invalid and valid are different</text><rect x="30" y="85" width="195" height="70" rx="12" fill="#e7f2f6" stroke="#9ab3c0"/><text x="46" y="122" font-size="22" fill="#173e55">Missing</text><rect x="245" y="85" width="195" height="70" rx="12" fill="#e7f2f6" stroke="#9ab3c0"/><text x="261" y="122" font-size="22" fill="#173e55">Empty</text><rect x="460" y="85" width="195" height="70" rx="12" fill="#e7f2f6" stroke="#9ab3c0"/><text x="476" y="122" font-size="22" fill="#173e55">Invalid</text><rect x="675" y="85" width="195" height="70" rx="12" fill="#e7f2f6" stroke="#9ab3c0"/><text x="691" y="122" font-size="22" fill="#173e55">Valid</text><text x="55" y="235" font-size="27" fill="#173e55">None</text><text x="265" y="235" font-size="22" fill="#173e55">POLYGON</text><text x="280" y="268" font-size="22" fill="#173e55">EMPTY</text><path d="M495 195 L620 305 L495 305 L620 195 Z" fill="#ffe5ee" stroke="#c2186a" stroke-width="4"/><path d="M710 205 L830 205 L830 305 L710 305 Z" fill="#e4f3ea" stroke="#23745a" stroke-width="4"/><text x="45" y="370" font-size="18" fill="#173e55">No geometry</text><text x="255" y="370" font-size="18" fill="#173e55">No coordinates</text><text x="475" y="370" font-size="18" fill="#173e55">Self-intersection</text><text x="690" y="370" font-size="18" fill="#173e55">Passes validity</text></g></svg>