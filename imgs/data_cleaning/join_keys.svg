<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">A join needs compatible AND unique keys</title><rect width="900" height="440" rx="18" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="42" font-size="28" fill="#173e55">A join needs compatible AND unique keys</text><rect x="40" y="85" width="330" height="75" rx="12" fill="#e7f2f6" stroke="#9ab3c0"/><text x="56" y="122" font-size="22" fill="#173e55">Features: area_id = &quot;001&quot;</text><rect x="510" y="85" width="350" height="75" rx="12" fill="#e7f2f6" stroke="#9ab3c0"/><text x="526" y="122" font-size="22" fill="#173e55">Lookup: area_id = &quot;001&quot;</text><text x="402" y="135" font-size="38" fill="#173e55">↔</text><text x="55" y="235" font-size="26" fill="#23745a">001 → Tampines</text><text x="55" y="295" font-size="26" fill="#23745a">002 → Bedok</text><text x="500" y="235" font-size="26" fill="#23745a">001 → Tampines</text><text x="500" y="295" font-size="26" fill="#c2186a">001 → Tampines East</text><text x="55" y="370" font-size="24" fill="#173e55">Keep IDs as text.</text><text x="500" y="370" font-size="21" fill="#c2186a">Duplicate key → extra joined rows.</text><text x="80" y="420" font-size="22" fill="#173e55">Check unmatched records and row counts after every join.</text></g></svg>