<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Clean field values without losing their meaning</title><rect width="900" height="440" rx="18" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="42" font-size="28" fill="#173e55">Clean field values without losing their meaning</text><rect x="35" y="80" width="350" height="65" rx="12" fill="#fff0f5" stroke="#9ab3c0"/><text x="51" y="117" font-size="22" fill="#173e55">Raw values</text><rect x="510" y="80" width="350" height="65" rx="12" fill="#e8f5ec" stroke="#9ab3c0"/><text x="526" y="117" font-size="22" fill="#173e55">Reviewed values</text><text x="55" y="195" font-size="24" fill="#173e55">&quot;  landed &quot;</text><text x="420" y="195" font-size="26" fill="#173e55">→</text><text x="530" y="195" font-size="24" fill="#173e55">&quot;LANDED&quot;</text><text x="55" y="255" font-size="24" fill="#173e55">&quot;1,200&quot;</text><text x="420" y="255" font-size="26" fill="#173e55">→</text><text x="530" y="255" font-size="24" fill="#173e55">1200 (number)</text><text x="55" y="315" font-size="24" fill="#173e55">&quot;012345&quot;</text><text x="420" y="315" font-size="26" fill="#173e55">→</text><text x="530" y="315" font-size="24" fill="#173e55">&quot;012345&quot; (text)</text><text x="55" y="375" font-size="24" fill="#173e55">&quot;unknown&quot;</text><text x="420" y="375" font-size="26" fill="#173e55">→</text><text x="530" y="375" font-size="24" fill="#173e55">Missing + review flag</text></g></svg>