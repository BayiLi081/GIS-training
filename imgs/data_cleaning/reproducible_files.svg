<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Keep source, decisions and outputs together</title><rect width="900" height="440" rx="18" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="42" font-size="28" fill="#173e55">Keep source, decisions and outputs together</text><rect x="45" y="85" width="240" height="80" rx="12" fill="#e7f2f6" stroke="#9ab3c0"/><text x="61" y="122" font-size="22" fill="#173e55">raw/ (read only)</text><rect x="330" y="85" width="240" height="80" rx="12" fill="#e7f2f6" stroke="#9ab3c0"/><text x="346" y="122" font-size="22" fill="#173e55">scripts/ or notebook</text><rect x="615" y="85" width="240" height="80" rx="12" fill="#e7f2f6" stroke="#9ab3c0"/><text x="631" y="122" font-size="22" fill="#173e55">processed/</text><text x="65" y="235" font-size="22" fill="#173e55">Original download</text><text x="65" y="280" font-size="22" fill="#173e55">Source URL + date</text><text x="350" y="235" font-size="22" fill="#173e55">Cleaning rules</text><text x="350" y="280" font-size="22" fill="#173e55">Environment versions</text><text x="635" y="235" font-size="22" fill="#173e55">clean.gpkg</text><text x="635" y="280" font-size="22" fill="#173e55">review.gpkg</text><text x="635" y="325" font-size="22" fill="#173e55">cleaning_log.csv</text><text x="90" y="405" font-size="22" fill="#173e55">Share the method and permitted data; retain a route back to the source.</text></g></svg>