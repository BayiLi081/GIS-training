<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Raw data → documented analytical data</title><rect width="900" height="440" rx="18" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="42" font-size="28" fill="#173e55">Raw data → documented analytical data</text><rect x="30" y="95" width="190" height="70" rx="12" fill="#e7f2f6" stroke="#9ab3c0"/><text x="46" y="132" font-size="22" fill="#173e55">Raw files</text><rect x="250" y="95" width="190" height="70" rx="12" fill="#e7f2f6" stroke="#9ab3c0"/><text x="266" y="132" font-size="22" fill="#173e55">Inspect</text><rect x="470" y="95" width="190" height="70" rx="12" fill="#e7f2f6" stroke="#9ab3c0"/><text x="486" y="132" font-size="22" fill="#173e55">Transform</text><rect x="690" y="95" width="190" height="70" rx="12" fill="#e7f2f6" stroke="#9ab3c0"/><text x="706" y="132" font-size="22" fill="#173e55">Validate</text><text x="225" y="140" font-size="30" fill="#173e55">→</text><text x="445" y="140" font-size="30" fill="#173e55">→</text><text x="665" y="140" font-size="30" fill="#173e55">→</text><rect x="60" y="225" width="350" height="100" rx="12" fill="#fff0f5" stroke="#9ab3c0"/><text x="76" y="262" font-size="22" fill="#173e55">Preserve the original</text><rect x="485" y="225" width="350" height="100" rx="12" fill="#e8f5ec" stroke="#9ab3c0"/><text x="501" y="262" font-size="22" fill="#173e55">Export + cleaning log</text><text x="80" y="295" font-size="20" fill="#173e55">Never overwrite the source</text><text x="505" y="295" font-size="20" fill="#173e55">Record decisions and exceptions</text><text x="55" y="390" font-size="25" fill="#c2186a">A map can look correct while its numbers are wrong.</text></g></svg>