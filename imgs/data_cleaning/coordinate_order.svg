<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Check coordinate order before creating points</title><rect width="900" height="440" rx="18" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="42" font-size="28" fill="#173e55">Check coordinate order before creating points</text><rect x="45" y="80" width="375" height="80" rx="12" fill="#e8f5ec" stroke="#9ab3c0"/><text x="61" y="117" font-size="22" fill="#173e55">Correct: x = lon, y = lat</text><rect x="480" y="80" width="375" height="80" rx="12" fill="#fff0f5" stroke="#9ab3c0"/><text x="496" y="117" font-size="22" fill="#173e55">Swapped: x = lat, y = lon</text><text x="65" y="210" font-size="32" fill="#23745a">(103.85, 1.30)</text><text x="505" y="210" font-size="32" fill="#c2186a">(1.30, 103.85)</text><path d="M80,335 L380,335" stroke="#237ca3" stroke-width="4" fill="none"/><path d="M80,335 L80,240" stroke="#237ca3" stroke-width="4" fill="none"/><circle cx="240" cy="285" r="10" fill="#c2186a"/><text x="257" y="291" font-size="19" fill="#173e55">Singapore</text><text x="510" y="285" font-size="26" fill="#c2186a">Latitude exceeds 90°</text><text x="510" y="330" font-size="20" fill="#173e55">Do not solve this with a new CRS.</text><text x="50" y="405" font-size="21" fill="#173e55">Illustrative coordinates; confirm field definitions and expected extent.</text></g></svg>