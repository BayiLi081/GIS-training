<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">Same location does not always mean duplicate</title><rect width="900" height="440" rx="18" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="42" font-size="28" fill="#173e55">Same location does not always mean duplicate</text><rect x="30" y="80" width="390" height="75" rx="12" fill="#fff0f5" stroke="#9ab3c0"/><text x="46" y="117" font-size="22" fill="#173e55">Repeated source record</text><rect x="480" y="80" width="390" height="75" rx="12" fill="#e8f5ec" stroke="#9ab3c0"/><text x="496" y="117" font-size="22" fill="#173e55">Different features at one location</text><circle cx="110" cy="225" r="10" fill="#c2186a"/><text x="127" y="231" font-size="19" fill="#173e55">A01 · café</text><circle cx="110" cy="295" r="10" fill="#c2186a"/><text x="127" y="301" font-size="19" fill="#173e55">A01 · café</text><circle cx="560" cy="225" r="10" fill="#c2186a"/><text x="577" y="231" font-size="19" fill="#173e55">B01 · clinic</text><circle cx="560" cy="295" r="10" fill="#23745a"/><text x="577" y="301" font-size="19" fill="#173e55">B02 · pharmacy</text><text x="50" y="360" font-size="21" fill="#173e55">Same ID + attributes + geometry</text><text x="500" y="360" font-size="21" fill="#173e55">Shared building; distinct IDs</text><text x="80" y="410" font-size="24" fill="#c2186a">Define the observation unit before removing records.</text></g></svg>