<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440"><title>Choose the relationship explicitly</title><rect width="1000" height="440" fill="white" rx="18"/><g font-family="Arial" fill="#173e55"><text x="30" y="45" font-size="27">Choose the relationship explicitly</text><rect x="30" y="80" width="460" height="150" rx="14" fill="#e5f2f8"/><text x="48" y="115" font-size="24" font-weight="bold">Attribute join</text><text x="48" y="152" font-size="21">Shared key: zone_id → zone_id</text><text x="48" y="181" font-size="21">Check uniqueness and unmatched keys</text><rect x="520" y="80" width="460" height="150" rx="14" fill="#fce5ef"/><text x="538" y="115" font-size="24" font-weight="bold">Spatial join</text><text x="538" y="152" font-size="21">Point within polygon</text><text x="538" y="181" font-size="21">Define boundary-point handling</text><rect x="30" y="250" width="460" height="150" rx="14" fill="#e5f4eb"/><text x="48" y="285" font-size="24" font-weight="bold">Nearest join</text><text x="48" y="322" font-size="21">Closest feature within a threshold</text><text x="48" y="351" font-size="21">Inspect distance and tied matches</text><rect x="520" y="250" width="460" height="150" rx="14" fill="#fff2dc"/><text x="538" y="285" font-size="24" font-weight="bold">Overlay / zonal summary</text><text x="538" y="322" font-size="21">Intersection or raster summary</text><text x="538" y="351" font-size="21">Account for fractional coverage</text></g></svg>