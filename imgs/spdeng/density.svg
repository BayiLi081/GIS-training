<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440"><title>Identical counts can imply different urban conditions</title><rect width="1000" height="440" fill="white" rx="18"/><g font-family="Arial" fill="#173e55"><text x="30" y="45" font-size="27">Identical counts can imply different urban conditions</text><rect x="30" y="80" width="460" height="150" rx="14" fill="#e5f2f8"/><text x="48" y="115" font-size="24" font-weight="bold">Zone A</text><text x="48" y="152" font-size="21">20 clinics / 2 km² = 10 per km²</text><text x="48" y="181" font-size="21">20 / 10,000 residents × 10,000 = 20</text><rect x="520" y="80" width="460" height="150" rx="14" fill="#fce5ef"/><text x="538" y="115" font-size="24" font-weight="bold">Zone B</text><text x="538" y="152" font-size="21">20 clinics / 10 km² = 2 per km²</text><text x="538" y="181" font-size="21">20 / 40,000 residents × 10,000 = 5</text><rect x="30" y="250" width="460" height="150" rx="14" fill="#e5f4eb"/><text x="48" y="285" font-size="24" font-weight="bold">Area denominator</text><text x="48" y="322" font-size="21">Describes spatial concentration</text><text x="48" y="351" font-size="21">Use an appropriate projected CRS</text><rect x="520" y="250" width="460" height="150" rx="14" fill="#fff2dc"/><text x="538" y="285" font-size="24" font-weight="bold">Population denominator</text><text x="538" y="322" font-size="21">Describes provision per resident</text><text x="538" y="351" font-size="21">Check zero, missing and dated counts</text></g></svg>