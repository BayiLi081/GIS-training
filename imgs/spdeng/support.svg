<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440"><title>The same city can produce different observation tables</title><rect width="1000" height="440" fill="white" rx="18"/><g font-family="Arial" fill="#173e55"><text x="30" y="45" font-size="27">The same city can produce different observation tables</text><rect x="30" y="80" width="460" height="150" rx="14" fill="#e5f2f8"/><text x="48" y="115" font-size="24" font-weight="bold">Building</text><text x="48" y="152" font-size="21">One row per building</text><text x="48" y="181" font-size="21">Useful for property-level questions</text><rect x="520" y="80" width="460" height="150" rx="14" fill="#fce5ef"/><text x="538" y="115" font-size="24" font-weight="bold">Street segment</text><text x="538" y="152" font-size="21">One row per network edge</text><text x="538" y="181" font-size="21">Useful for streetscape and movement</text><rect x="30" y="250" width="460" height="150" rx="14" fill="#e5f4eb"/><text x="48" y="285" font-size="24" font-weight="bold">Grid cell</text><text x="48" y="322" font-size="21">One row per equal-sized cell</text><text x="48" y="351" font-size="21">Useful for comparable spatial summaries</text><rect x="520" y="250" width="460" height="150" rx="14" fill="#fff2dc"/><text x="538" y="285" font-size="24" font-weight="bold">Administrative area</text><text x="538" y="322" font-size="21">One row per zone</text><text x="538" y="351" font-size="21">Useful for policy and census reporting</text></g></svg>