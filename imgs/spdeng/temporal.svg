<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440"><title>A shared location does not imply a shared date</title><rect width="1000" height="440" fill="white" rx="18"/><g font-family="Arial" fill="#173e55"><text x="30" y="45" font-size="27">A shared location does not imply a shared date</text><rect x="30" y="80" width="460" height="150" rx="14" fill="#e5f2f8"/><text x="48" y="115" font-size="24" font-weight="bold">Observation window</text><text x="48" y="152" font-size="21">Target: visits during 2022</text><text x="48" y="181" font-size="21">Predictors available before / during 2022</text><rect x="520" y="80" width="460" height="150" rx="14" fill="#fce5ef"/><text x="538" y="115" font-size="24" font-weight="bold">Seasonality</text><text x="538" y="152" font-size="21">Greenness: comparable season</text><text x="538" y="181" font-size="21">Transit: weekday or weekend service</text><rect x="30" y="250" width="460" height="150" rx="14" fill="#e5f4eb"/><text x="48" y="285" font-size="24" font-weight="bold">Boundary changes</text><text x="48" y="322" font-size="21">Use a documented crosswalk</text><text x="48" y="351" font-size="21">Retain original and harmonised IDs</text><rect x="520" y="250" width="460" height="150" rx="14" fill="#fff2dc"/><text x="538" y="285" font-size="24" font-weight="bold">Future information</text><text x="538" y="322" font-size="21">2024 POIs cannot explain a 2022 forecast</text><text x="538" y="351" font-size="21">Track source date and availability date</text></g></svg>