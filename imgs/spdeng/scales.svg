<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440"><title>Repeat the question at more than one spatial scale</title><rect width="1000" height="440" fill="white" rx="18"/><g font-family="Arial" fill="#173e55"><text x="30" y="45" font-size="27">Repeat the question at more than one spatial scale</text><rect x="30" y="80" width="460" height="150" rx="14" fill="#e5f2f8"/><text x="48" y="115" font-size="24" font-weight="bold">Local catchment</text><text x="48" y="152" font-size="21">200 m: immediate surroundings</text><text x="48" y="181" font-size="21">Sensitive to point position</text><rect x="520" y="80" width="460" height="150" rx="14" fill="#fce5ef"/><text x="538" y="115" font-size="24" font-weight="bold">Neighbourhood catchment</text><text x="538" y="152" font-size="21">800 m: broader surroundings</text><text x="538" y="181" font-size="21">Nearby observations overlap</text><rect x="30" y="250" width="460" height="150" rx="14" fill="#e5f4eb"/><text x="48" y="285" font-size="24" font-weight="bold">Administrative aggregation</text><text x="48" y="322" font-size="21">Zone averages hide within-zone variation</text><text x="48" y="351" font-size="21">Boundary choices change summaries</text><rect x="520" y="250" width="460" height="150" rx="14" fill="#fff2dc"/><text x="538" y="285" font-size="24" font-weight="bold">Sensitivity check</text><text x="538" y="322" font-size="21">Compare effect and ranking across scales</text><text x="538" y="351" font-size="21">Select scales from the mechanism</text></g></svg>