<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440"><title>Evaluate the geography you intend to predict</title><rect width="1000" height="440" fill="white" rx="18"/><g font-family="Arial" fill="#173e55"><text x="30" y="45" font-size="27">Evaluate the geography you intend to predict</text><rect x="30" y="80" width="460" height="150" rx="14" fill="#e5f2f8"/><text x="48" y="115" font-size="24" font-weight="bold">Random split</text><text x="48" y="152" font-size="21">Neighbours appear in train and test</text><text x="48" y="181" font-size="21">Can reward spatial similarity</text><rect x="520" y="80" width="460" height="150" rx="14" fill="#fce5ef"/><text x="538" y="115" font-size="24" font-weight="bold">Spatial holdout</text><text x="538" y="152" font-size="21">Keep geographic blocks together</text><text x="538" y="181" font-size="21">Test transfer to unseen places</text><rect x="30" y="250" width="460" height="150" rx="14" fill="#e5f4eb"/><text x="48" y="285" font-size="24" font-weight="bold">Temporal holdout</text><text x="48" y="322" font-size="21">Train on earlier observations</text><text x="48" y="351" font-size="21">Test a later period</text><rect x="520" y="250" width="460" height="150" rx="14" fill="#fff2dc"/><text x="538" y="285" font-size="24" font-weight="bold">Training-only transforms</text><text x="538" y="322" font-size="21">Fit imputation and scaling inside folds</text><text x="538" y="351" font-size="21">Avoid target-derived neighbourhood features</text></g></svg>