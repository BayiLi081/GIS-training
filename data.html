## Week 2 Focus

This lecture introduces where urban spatial data comes from, how open data systems work in Singapore, and how students should evaluate data before analysis.

- identify major urban data sources in Singapore
- distinguish between downloadable datasets, APIs, and geospatial web services
- understand the strengths and limits of open data for urban studies
- prepare for later weeks in Python, QGIS, and spatial analysis

---

## Learning Objectives

By the end of this session, students should be able to:

1. describe the main categories of urban data used in GIS and urban analysis
2. identify key open data platforms in Singapore, especially OneMap and data.gov.sg
3. explain the difference between static downloads, APIs, and geocoding services
4. assess whether a dataset is suitable for a particular research question
5. follow a basic workflow for discovering, accessing, and documenting urban data

---

## Lecture Outline

1. Why urban data sources matter
2. Main open data portals and geospatial services in Singapore
3. Common data formats for urban analysis
4. Practical issues: metadata, access limits, and responsible use
5. Tutorial workflow for discovering and retrieving data

---

## Why Urban Data Sources Matter

Urban analysis is shaped by the data that is available.

- Data sources determine what questions can be asked
- Data quality affects how results should be interpreted
- Data format affects how much cleaning and transformation is needed
- Data governance affects what can be shared, reproduced, or published

Before analysis begins, students need to know not only how to map data, but where the data comes from and what it can support.

---

name: sources

## Main Categories of Urban Data

Urban GIS commonly works with several broad sources of data:

- government open data portals
- official basemaps and geospatial services
- survey and census-style administrative data
- transport, land use, and built-environment datasets
- environmental and remote sensing data
- volunteered or platform-generated data

Each source comes with different levels of resolution, coverage, update frequency, and reliability.

---

## Key Open Data Platforms in Singapore

- **OneMap**: authoritative national map services and geospatial APIs
- **data.gov.sg**: national open data portal covering many sectors
- **Singapore Department and Agency portals**: thematic datasets, reports, and dashboards

These are often used together rather than separately.

## OneMap

OneMap is the authoritative national map of Singapore developed by the Singapore Land Authority (SLA).

It provides:

- geospatial basemaps
- address search and geocoding
- nearby service queries
- routing and location-based services
- APIs for programmatic access

data.gov.sg is the national open data portal.

It is useful for:

- population and socio-economic statistics
- transport and mobility records
- environmental monitoring
- housing and planning-related datasets
- tabular datasets that can later be joined to spatial boundaries

For urban analysis, this portal is often the starting point for non-spatial attributes.

## Other Useful Urban Data Sources

- census and statistical publications
- planning and land-use resources from relevant agencies
- remote sensing imagery from open international programs
- OpenStreetMap for volunteered geographic information
- academic or civic datasets released through project websites

Students should always ask whether a dataset is official, derived, crowdsourced, or modelled.

## Ways to Access Urban Data

There are three common access patterns:

1. **Direct download**: CSV, GeoJSON, Shapefile, GeoPackage, raster files
2. **API request**: programmatic query through a URL and parameters
3. **Web service**: interactive or tiled map service consumed by GIS software

Different access methods support different workflows.

---

### OneMap API call

step 1: <xL>https://www.onemap.gov.sg/apidocs/register</xL>

step 2: [Get your access token](https://www.onemap.gov.sg/apidocs/authentication)

```python
import requests
import os
            
url = "https://www.onemap.gov.sg/api/auth/post/getToken"
            
payload = {
              "email": os.environ['ONEMAP_EMAIL'],
              "password": os.environ['ONEMAP_EMAIL_PASSWORD']
            }
            
response = requests.request("POST", url, json=payload)
            
print(response.text)
```

### Geocoding

Geocoding converts addresses or place descriptions into geographic coordinates.

OneMap provides Geocoding services as instructed in https://www.onemap.gov.sg/apidocs/search

### Other Useful tools

- [Google Maps Platform](https://developers.google.com/maps): Provides APIs for map, including for geocoding and reverse geocoding
- [Mapbox](https://mapbox.com): An alternative to Google Maps
- [Esri ArcGIS Platform or ArcGIS pro](https://esri.com): Design for Esri User, but with limitation of quota
- [Nominatum](https://nominatim.openstreetmap.org): An open source geocoding services
- [geopy](https://github.com/geopy/geopy): A Python library to use geocoding services

---

### Notes on Geocoding

- Street names/Postcodes are not unique to a specific country. A postcode could refer to multiple locations in different countries.

  <xL>it is better always to specify the country name.</xL>

- A postcode may represent a small area unit or branches of the same facilities, which cannot be used to identify an accurate location by postcode alone.

  **Example of Indonesia's Postcode system**

  Indonesia's postcode system, known locally as "Kode Pos," is a five-digit numerical code used to simplify the sorting and delivery of mail.

  The first two digits represent the province or metropolitan area, while the subsequent digits further refine the location to specific districts and sub-districts. A postcode generally cannot be used to identify a specific house. 
  
  While postcodes help narrow down locations, they typically cover multiple houses, buildings, or even entire neighborhoods. To pinpoint a specific house, you would need additional address details such as the street name and house number.

### JSON and Nested Data

Many APIs return JSON rather than flat tables.

JSON is useful because it can store nested structures such as:

- metadata about the request
- multiple records in a list
- attributes grouped inside parent objects

We can use [a JSON viewer/formatter website](https://jsonformatter.org/json-viewer) to understand and explore data structures

---

[Example: Query of Nearby Transport](https://www.onemap.gov.sg/apidocs/nearbytransport)

```Python
import requests
    
url = "https://www.onemap.gov.sg/api/public/nearbysvc/getNearestMrtStops?latitude=1.4044693603639506&longitude=103.90083627504391&radius_in_meters=1000"
    
headers = {"Authorization": "**********************"}
    
response = requests.get(url, headers=headers)
    
print(response.text)
```

## Common Data Formats

You will often encounter the following data formats in week 2:

- **CSV**: simple tabular data for analysis and joins
- **Excel**: convenient but less reproducible than CSV
- **JSON**: common for API responses
- **GeoJSON / Shapefile / GeoPackage**: vector spatial data
- **Raster formats**: imagery, environmental grids, elevation, land cover

Different formats are not just technical details. They shape how the data can be cleaned, joined, mapped, and shared.

---

CSV is often the most convenient format for first access because it is simple, reliable, and widely supported.

## What to Check Before Using a Dataset

Before analysis, ask:

- Who produced the data?
- What is the spatial unit?
- What is the temporal coverage?
- How often is it updated?
- Are there missing values or access restrictions?
- Does the data match the research question and scale?

A technically accessible dataset may still be analytically inappropriate.

---

## Open Data Does Not Mean Friction-Free Data

Even open datasets may require:

- cleaning field names and encodings
- joining non-spatial tables to boundaries
- converting coordinates or file formats
- interpreting metadata carefully
- documenting assumptions and transformations

Open data reduces access barriers, but it does not remove the need for critical judgement.

## Tutorial Workflow

For week 2, a practical data discovery workflow is:

1. define a simple urban question
2. search OneMap and data.gov.sg for relevant datasets
3. inspect the metadata, fields, and update dates
4. retrieve a small sample by download or API
5. identify whether the data is spatial or needs geocoding/joining
6. document the source and any access constraints

---

## Example Tutorial Questions

- Which data source would you use for addresses, basemaps, and geocoding?
- Which portal is better for tabular indicators such as counts or rates?
- Which dataset is suitable for direct mapping, and which needs preprocessing first?
- What are the risks of using postcode-level or area-level data as if it were point-precise?

## Simple Join Logic

### Table Join

.left_half[
**(INNER) JOIN**: Returns records that have matching values in both tables

<img src="imgs/pandas/img_inner_join.png" width="40%">

**LEFT (OUTER) JOIN**: Returns all records from the left table, and the matched records from the right table

<img src="imgs/pandas/img_left_join.png" width="40%">
]

.right_half[
**FULL (OUTER) JOIN**: Returns all records when there is a match in either left or right table

<img src="imgs/pandas/img_full_outer_join.png" width="40%">

**RIGHT (OUTER) JOIN**: Returns all records from the right table, and the matched records from the left table

<img src="imgs/pandas/img_right_join.png" width="40%">
]

## Key Takeaways

- Urban analysis starts with understanding data sources, not just analysis methods.
- In Singapore, OneMap and data.gov.sg are two essential platforms for urban GIS work.
- APIs, downloads, and web services each support different workflows.
- Metadata, scale, update frequency, and data structure all affect analytical quality.
- A good analyst documents how data was discovered, retrieved, and transformed.
