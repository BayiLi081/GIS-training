## Data Acquiring

### OneMap API call

step 1: <xL>https://www.onemap.gov.sg/apidocs/register</xL>

step 2: [Get your access token](https://www.onemap.gov.sg/apidocs/authentication)

```python
import requests
import os
            
url = "https://www.onemap.gov.sg/api/auth/post/getToken"
            
payload = {
              "email": os.environ['ONEMAP_EMAIL'],
              "password": os.environ['ONEMAP_EMAIL_PASSWORD']
            }
            
response = requests.request("POST", url, json=payload)
            
print(response.text)
```

Open [2-01_data_acquiring.ipynb](https://github.com/BayiLi081/GIS-training/blob/py-bootcamp/jupyters/2-01_data_acquiring.ipynb) with Google Colab.

# !Protecting your secret credential!

# !Protecting your secret credential!

# !Protecting your secret credential!

An API key / access token is a **secret credential**.  

Anyone with access to it can use your account and incur costs.

You must treat it like a password.

---

[Example: Query of Nearby Transport](https://www.onemap.gov.sg/apidocs/nearbytransport)

```Python
import requests
    
url = "https://www.onemap.gov.sg/api/public/nearbysvc/getNearestMrtStops?latitude=1.4044693603639506&longitude=103.90083627504391&radius_in_meters=1000"
    
headers = {"Authorization": "**********************"}
    
response = requests.get(url, headers=headers)
    
print(response.text)
```

## Tabular Data 

csv: most recommended and common tabular data format because it is simple, reliable, and widely supported

```python
import pandas as pd

df = pd.read_csv("data.csv")
```

```python
pd.read_csv("data.csv", sep=";")        # custom separator
pd.read_csv("data.csv", header=0)       # header row
pd.read_csv("data.csv", encoding="utf-8")
```

excel: an external excel engine (openpyxl for .xlsx or xlrd for .xls)

```python
import pandas as pd

df = pd.read_excel("data.xlsx")
```

```python
pd.read_excel("data.xlsx", sheet_name="Sheet1")
```

### Table Join

.left_half[
**(INNER) JOIN**: Returns records that have matching values in both tables

<img src="imgs/pandas/img_inner_join.png" width="40%">

**LEFT (OUTER) JOIN**: Returns all records from the left table, and the matched records from the right table

<img src="imgs/pandas/img_left_join.png" width="40%">
]

.right_half[
**FULL (OUTER) JOIN**: Returns all records when there is a match in either left or right table

<img src="imgs/pandas/img_full_outer_join.png" width="40%">

**RIGHT (OUTER) JOIN**: Returns all records from the right table, and the matched records from the left table

<img src="imgs/pandas/img_right_join.png" width="40%">
]

]

## Visualisation

### Seaborn: statistical data visualisation

1. **[Matplotlib](https://matplotlib.org/)**: foundation library

2. **[Seaborn](https://seaborn.pydata.org/index.html)**: Uses Matplotlib under the hood

3. **[Plotly](https://plotly.com/python/getting-started/)**: interactive visualisation

Seaborn is selected for this bootcamp because it lets learners make solid statistical plots fast, with less code and fewer traps than raw Matplotlib.
