<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="src/custom.css">
  <link rel="stylesheet" href="src/markdown.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body class="markdown-document">
  <main id="content" class="markdown-page">Loading…</main>

  <script>
    const file = new URLSearchParams(location.search).get("file");

    // Only permit Markdown files inside docs/
    if (!file || !/^docs\/[\w./-]+\.md$/.test(file) || file.includes("..")) {
      document.querySelector("#content").textContent = "Invalid document.";
    } else {
      fetch(file)
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then(markdown => {
          document.querySelector("#content").innerHTML =
            DOMPurify.sanitize(marked.parse(markdown));
        })
        .catch(error => {
          document.querySelector("#content").textContent =
            `Could not load document: ${error.message}`;
        });
    }
  </script>
</body>
</html>
