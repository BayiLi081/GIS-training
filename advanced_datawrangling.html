## Data Wrangling

Data wrangling is the process of cleaning and transforming raw data into a format suitable for analysis. In the context of GIS, this often involves manipulating spatial data to ensure it is accurate, complete, and in the right format for analysis.

## Programming with QGIS Python Console

The QGIS Python Console is a built-in tool that lets users automate workflows and perform advanced spatial data analysis. It allows users to write and execute Python scripts within the QGIS environment, giving access to QGIS’s API (PyQGIS) and all its geoprocessing capabilities.

<div align="center">
  <figure>
    <img src="imgs/data_cleaning/python_console_qgis.jpg" width="60%">
    <img src="imgs/data_cleaning/python_editor.jpg" width="60%">
  </figure>
</div>

## Issue of using QGIS Python Console

However, running complex or large-scale tasks through the console can sometimes be slow and may cause the interface to become unresponsive.

<div align="center">
  <figure>
    <img src="imgs/data_cleaning/whynotrunpython_directly_withqgis.jpg" width="90%">
  </figure>
</div>

In such cases, executing the same scripts directly in a standalone Python environment (for example, using a script that imports qgis.core) is often more efficient and stable.
