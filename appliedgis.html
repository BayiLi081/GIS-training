### Choropleth and Cartogram

  Cartogram is to reshape geographic units so they emphasise a specific logic rather than their exact physical form.

  It tries to keep adjacency and neighbourhoods, though some distortions still appear.

## Advanced Visualisation and Mapping

### Choropleth and Cartogram

  The biggest advantage of using a cartogram is that it **removes the visual bias created by the actual size and shape of geographic areas**, allowing the reader to focus on the underlying data rather than the geography.

  Cartograms are used far more often in newspapers than in academic papers for better communication than spatial fidelity.

  <div align="center">
    <figure>
      <img src="imgs/applygis/cartogram_example2.png" class="zoomable" width="45%">
      <figcaption>US Presidential Election 2020 visualised by Choropleth and cartogram.</figcaption>
      <figsubcaption>Source: https://worldmapper.org/us-presidential-election-2020/</figsubcaption>
    </figure>
  </div>

---

### Tile map

A tile map is <u>a variant of a cartogram</u>. Every unit takes on a simplified, standardised shape, often a square or a hexagon. 

Each tile has equal size, so visual weight is uniform across all units. 

This removes differences caused by actual land area and shifts attention to relationships, patterns and comparisons.

  <div align="center">
    <figure>
      <img src="imgs/applygis/HexGridCartograms.jpg" class="zoomable" width="80%">
      <figcaption>The same data visualized using a grid and hexagonal cartogram with slightly different arrangements of states.</figcaption>
      <figsubcaption>Source: https://www.esri.com/arcgis-blog/products/arcgis-online/mapping/how-to-build-a-cartogram-in-microsoft-office-and-arcgis-online</figsubcaption>
    </figure>
  </div>

---

### Dorling Cartogram

It is a type of cartogram in which each geographic region is replaced by a circle. The size of the circle represents a chosen variable, and the circles are positioned so they roughly reflect the regions’ locations.

  <div align="center">
    <figure>
      <img src="imgs/applygis/dorlingcartogram.jpg" class="zoomable" width="70%">
      <figcaption>Congressional seats awarded to each state from the 2020 census.</figcaption>
      <figsubcaption>Source: https://www.esri.com/arcgis-blog/products/arcgis-pro/mapping/graphical-cartograms-in-arcgis-pro</figsubcaption>
    </figure>
  </div>

## Modifiable Areal Unit Problem

> A problem arising from the imposition of artificial units of spatial reporting on continuous geographical phenomena resulting in the generation of artificial spatial patterns

> -- Heywood (1998)

--

<div style="display: flex; justify-content: center; gap: 40px; align-items: flex-start;">
  <!-- Scale effect -->
  <div>
    <p><b>Scale effect</b></p>
    <p>Zonal values change when the number of zones used to report the data changes.</p>
    <p>Variation seen at a finer scale (for example, enumeration districts) often decreases when the same data are aggregated into fewer, larger zones at a coarser scale (such as wards or counties).</p>
    <img src="imgs/applygis/maup_scale_effect.jpg"
         alt="maup_scale_effect"
         style="width: 300px;">
    <figcaption>at different aggregation levels</figcaption>
    <figsubcaption>Source: https://gisgeography.com/maup-modifiable-areal-unit-problem/</figsubcaption>
  </div>

  <!-- Zonation effect -->
  <div>
    <p><b>Zonation effect</b></p>
    <p>Zonal values change because the geography of the zoning scheme shapes how data are aggregated. The same number of zones can be drawn in many different ways.</p>
    <img src="imgs/applygis/maup_zonation_effect.png"
         alt="maup_zonation_effect"
         style="width: 400px;">
    <figcaption>under different zoning schemes</figcaption>
    <figsubcaption>Source: https://gisgeography.com/maup-modifiable-areal-unit-problem/</figsubcaption>
  </div>

</div>

### Addressing MAUP

**Regular grid (tessellation) systems**

Using grids (square or hexagon) avoids arbitrary administrative shapes and gives full control over the level of aggregation.

Why it addresses both:

Scale effect: you can vary grid size to test sensitivity.

Zonation effect: grid geometry stays consistent, so shapes do not shift across areas.

**H3 Hexagon**

H3 is a geospatial indexing system that **partitions the world** into hexagonal cells.

Hierarchal hexagons are sized such that every larger polygon is divided into seven equal-sized smaller hexagons that all have an equal distance to the center of their neighbors.

H3 is useful for **both visualisation and analysis**: reproducible workflows and scalable spatial processing.

### Addressing MAUP

**Multi-scale, multi-zonation sensitivity analysis**

Run the same model under:

`several grid sizes`

`several boundary systems (grids, administrative units, neighbourhood clusters)` 

`several randomised zonations`

Why it works:

It exposes how much results depend on both scale and boundary layout.

If patterns remain stable across many configurations, findings are robust to MAUP.

### Addressing MAUP

**Continuous-surface modelling**

KDE (Kernel Density Estimation)

KDE surface can be visualised using isolines (right bottom).

- Treats the phenomenon as continuous over space rather than forced into zones.

- Reduces reliance on boundaries and zone sizes altogether.

### Addressing MAUP

**Optimised regionalisation (zone design algorithms)**

AZP (Automatic Zoning Procedure)

AZP is a heuristic method that searches for the best way to group contiguous spatial units into regions. It aims to minimise the within-region sum of squares, producing zones that are more homogeneous.

- Produces zones that minimise internal heterogeneity and maximise external differences.

- Works across different scales and reduces artefacts from arbitrary shapes.

**Reference:** [Openshaw (1977)](https://lanselin.github.io/introbook_vol2/automatic-zoning-procedure-azp.html)

### Parsing the HTML value

```python
def html_to_dict(html_text):
    t = pd.read_html(StringIO(f"<html>{html_text}</html>"))[0]
    t.columns = ["Attribute", "Value"]
    return dict(zip(t["Attribute"], t["Value"]))

expanded = data_gdf["Description"].apply(html_to_dict).apply(pd.Series)

clean_gdf = pd.concat([data_gdf.drop(columns=["Description"]), expanded], axis=1)

clean_gdf.head()
```

---

### Export it as cleaned GeoJSON
