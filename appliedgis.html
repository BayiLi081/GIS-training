## Data Interpretation and Visualisation

---

- **Euclidean Distance**

  The <u>straight-line</u> distance between two points.

- **Network-based Distance**

  - **Shortest network distance**: The smallest physical length <u>along the network</u>.

  - **Shortest network time**: Considers <u>realistic factors</u> such as speed limits, traffic conditions, and other attributes to estimate travel time.

- **Manhattan Distance**

  The sum of absolute differences in coordinates. 
  
  Common in <u>grid-based systems and certain analytical contexts</u>, though less used for real-world road routing.
